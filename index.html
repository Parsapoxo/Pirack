<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirack</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --surface:#121213;
    --surface-2:#18181a;
    --line:#26262a;
    --text:#f2f2f3;
    --muted:#8f8f96;
    --violet:#e21f3d;
    --cyan:#f2b705;
    --gold:#f2b705;
    --ember:#ff3b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  canvas#bg{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0;
    display:block;
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, transparent 0%, rgba(12,6,7,0.55) 70%, rgba(12,6,7,0.95) 100%);
  }
  .gridlines{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:
      linear-gradient(rgba(226,31,61,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,31,61,0.06) 1px, transparent 1px);
    background-size:42px 42px;
    background-position:center center;
    -webkit-mask-image:radial-gradient(ellipse at 50% 20%, black 0%, transparent 75%);
    mask-image:radial-gradient(ellipse at 50% 20%, black 0%, transparent 75%);
  }
  .content{ position:relative; z-index:2; }

  .menu-btn{
    position:fixed;
    top:18px; right:18px;
    z-index:40;
    width:42px; height:42px;
    border-radius:11px;
    background:rgba(18,18,19,0.85);
    border:1px solid var(--line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color .2s, color .2s;
  }
  .menu-btn:hover{ border-color:var(--violet); color:var(--violet); }
  .menu-btn svg{ width:20px; height:20px; }

  .drawer-overlay{
    position:fixed; inset:0; z-index:49;
    background:rgba(0,0,0,0.6);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed;
    top:0; right:0; bottom:0;
    z-index:50;
    width:300px;
    max-width:85vw;
    background:var(--surface);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
    display:flex;
    flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    font-weight:700;
    font-size:15px;
  }
  .drawer-close{
    background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer;
  }
  .drawer-close:hover{ color:var(--text); }
  .drawer-body{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .wp-option{
    display:flex; align-items:center; gap:12px;
    padding:9px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface-2);
    cursor:pointer;
    transition:border-color .2s;
  }
  .wp-option:hover{ border-color:rgba(255,255,255,0.25); }
  .wp-option.selected{ border-color:var(--violet); box-shadow:0 0 0 1px var(--violet); }
  .wp-thumb{
    width:52px; height:36px;
    border-radius:7px;
    overflow:hidden;
    flex-shrink:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .wp-thumb img, .wp-thumb video{ width:100%; height:100%; object-fit:cover; }
  .wp-name{ flex:1; font-size:14px; font-weight:600; }
  .wp-check{ color:var(--violet); font-size:14px; opacity:0; }
  .wp-option.selected .wp-check{ opacity:1; }

  .custom-wallpaper{
    position:fixed; inset:0; z-index:0;
    display:none;
  }
  .custom-wallpaper.active{ display:block; }
  .custom-wallpaper img, .custom-wallpaper video{
    width:100%; height:100%; object-fit:cover;
  }


  header{
    padding:56px 6vw 10px;
    text-align:center;
  }
  .brand-logo{
    width:160px; height:160px;
    border-radius:22px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#000;
    margin:0 auto 18px;
  }
  .brand-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  h1{
    font-family:'Inter',sans-serif;
    font-weight:900;
    font-size:clamp(32px,6vw,50px);
    letter-spacing:0.03em;
    color:var(--violet);
    line-height:1;
  }
  .sub{
    margin-top:14px;
    color:var(--muted);
    font-size:15px;
    max-width:420px;
    margin-inline:auto;
    letter-spacing:0.02em;
  }
  .sub.file-password{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    max-width:none;
  }
  .sub.file-password strong{ color:var(--text); font-weight:700; }
  .copy-btn{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    color:var(--muted);
    width:28px; height:28px;
    border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:color .2s, border-color .2s, background .2s;
  }
  .copy-btn svg{ width:14px; height:14px; }
  .copy-btn:hover{ color:var(--text); border-color:rgba(255,255,255,0.25); }
  .copy-btn.copied{ color:#2ecc71; border-color:rgba(46,204,113,0.5); }

  .toolbar{
    max-width:1100px;
    margin:8px auto 8px;
    padding:0 6vw;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }
  .item-shop-card{
    position:relative;
    flex:1 1 340px;
    max-width:480px;
    height:48px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:0 18px;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(226,31,61,0.12), rgba(242,183,5,0.08));
    border:1px solid rgba(242,183,5,0.35);
    overflow:hidden;
  }
  .item-shop-card::before{
    content:'';
    position:absolute;
    inset:-40%;
    background:radial-gradient(circle, rgba(242,183,5,0.25), transparent 60%);
    animation:shopGlow 3.2s ease-in-out infinite;
  }
  @keyframes shopGlow{
    0%, 100%{ opacity:0.5; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  .item-shop-card .shop-icon{
    font-size:19px;
    position:relative; z-index:1;
  }
  .item-shop-card .shop-text{
    position:relative; z-index:1;
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .item-shop-card .shop-badge{
    position:relative; z-index:1;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(242,183,5,0.5);
    border-radius:999px;
    padding:3px 9px;
  }
  .search-wrap{
    position:relative;
    flex:1 1 340px;
    max-width:480px;
  }
  .search-wrap svg{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--muted);
  }
  #search{
    width:100%;
    height:48px;
    box-sizing:border-box;
    padding:0 18px 0 46px;
    background:rgba(17,17,25,0.8);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:500;
    backdrop-filter:blur(8px);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{border-color:var(--violet); box-shadow:0 0 0 3px rgba(226,31,61,0.18);}

  .count{
    font-size:13px; color:var(--muted); text-align:center; margin:14px 0 8px;
    font-family:'Inter',sans-serif; letter-spacing:0.05em;
  }

  .view-tabs{
    position:relative;
    max-width:420px;
    margin:20px auto 0;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
  }
  .view-tabs .thumb{
    position:absolute;
    top:4px; bottom:4px;
    left:4px;
    width:calc(33.333% - 4px);
    background:linear-gradient(90deg,var(--violet),#b3172c);
    border-radius:9px;
    transform:translateX(0);
    transition:transform .3s cubic-bezier(.65,0,.35,1);
    z-index:0;
  }
  .view-tabs.apps-active .thumb{ transform:translateX(100%); }
  .view-tabs.leaderboard-active .thumb{ transform:translateX(200%); }
  .view-tab{
    position:relative;
    z-index:1;
    background:none;
    border:none;
    padding:10px 0;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    cursor:pointer;
    border-radius:9px;
    transition:color .25s ease;
  }
  .view-tab.active{ color:#fff; }
  .view-tab:hover:not(.active){ color:var(--text); }

  .lb-wrap{ max-width:760px; margin:32px auto 0; padding:0 6vw 60px; }

  .podium{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:14px;
    margin-bottom:36px;
  }
  .podium-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    width:150px;
  }
  .podium-card.rank-2{ order:1; }
  .podium-card.rank-1{ order:2; }
  .podium-card.rank-3{ order:3; }
  .podium-avatar{
    border-radius:16px;
    overflow:hidden;
    background:var(--surface-2);
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; font-weight:800; color:var(--muted);
  }
  .podium-card.rank-1 .podium-avatar{ width:84px; height:84px; font-size:28px; border-color:rgba(255,215,0,0.6); box-shadow:0 0 0 3px rgba(255,215,0,0.15); }
  .podium-card.rank-2 .podium-avatar{ width:68px; height:68px; font-size:22px; border-color:rgba(201,210,218,0.55); }
  .podium-card.rank-3 .podium-avatar{ width:68px; height:68px; font-size:22px; border-color:rgba(205,127,50,0.55); }
  .podium-avatar img{ width:100%; height:100%; object-fit:cover; }
  .podium-name{ font-weight:700; font-size:14.5px; text-align:center; }
  .podium-badge{
    display:flex; align-items:center; gap:5px;
    font-family:'Inter',sans-serif;
    font-size:11px; font-weight:700;
    padding:5px 10px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
  }
  .podium-card.rank-1 .podium-badge{ color:#ffd700; border-color:rgba(255,215,0,0.45); }
  .podium-card.rank-2 .podium-badge{ color:#c9d2da; border-color:rgba(201,210,218,0.4); }
  .podium-card.rank-3 .podium-badge{ color:#cd7f32; border-color:rgba(205,127,50,0.45); }
  .podium-platform{
    width:100%;
    border-radius:12px 12px 0 0;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);
    border-bottom:none;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    gap:2px;
    padding:10px 6px;
  }
  .podium-card.rank-1 .podium-platform{ height:88px; border-color:rgba(255,215,0,0.35); }
  .podium-card.rank-2 .podium-platform{ height:64px; }
  .podium-card.rank-3 .podium-platform{ height:48px; }
  .podium-prize{
    display:flex; align-items:center; gap:4px;
    font-family:'Inter',sans-serif; font-weight:800; font-size:13px;
    color:var(--text);
  }
  .podium-prize-label{ font-size:10px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; }

  .lb-table{ display:flex; flex-direction:column; gap:8px; }
  .lb-head{
    display:flex; align-items:center; gap:14px;
    padding:0 16px 6px;
    font-family:'Inter',sans-serif;
    font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  .lb-row{
    display:flex; align-items:center; gap:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 16px;
  }
  .lb-rank{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:13px;
    width:26px;
    text-align:center;
    color:var(--muted);
    display:flex; align-items:center; gap:3px; justify-content:center;
  }
  .lb-avatar{
    width:38px; height:38px; border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:hidden;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; color:var(--muted);
  }
  .lb-avatar img{ width:100%; height:100%; object-fit:cover; }
  .lb-player{ flex:1; font-weight:600; font-size:14.5px; }
  .lb-col-score{ width:70px; text-align:right; font-family:'Inter',sans-serif; font-weight:700; font-size:13px; }
  .lb-col-prize{
    width:90px; text-align:right;
    font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px;
    color:var(--text);
  }
  .lb-empty{ text-align:center; color:var(--muted); padding:50px 20px; font-size:14px; }
  .hidden{ display:none !important; }

  .grid{
    max-width:1300px;
    margin:0 auto;
    padding:24px 6vw 100px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
  }
  @media (max-width:900px){
    .grid{ grid-template-columns:repeat(2,1fr); gap:18px; }
  }
  @media (max-width:560px){
    .grid{ grid-template-columns:1fr; gap:16px; }
  }

  .card{
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,0.18);
    box-shadow:0 16px 40px rgba(0,0,0,0.55);
  }
  .poster-wrap{
    position:relative;
    aspect-ratio:16/9;
    background:var(--surface-2);
    overflow:hidden;
    display:block;
  }
  .poster-wrap img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    transition:transform .4s ease;
  }
  .card:hover .poster-wrap img{ transform:scale(1.06); }
  .poster-fallback{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:18px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    background:
      radial-gradient(circle at 30% 20%, rgba(226,31,61,0.35), transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(242,183,5,0.3), transparent 55%),
      var(--surface-2);
  }
  .badge{
    position:absolute; top:10px; right:10px;
    font-family:'Inter',sans-serif;
    font-size:10px; letter-spacing:.08em;
    padding:5px 9px; border-radius:999px;
    background:rgba(7,7,12,0.75);
    border:1px solid rgba(242,183,5,0.4);
    color:var(--cyan);
    backdrop-filter:blur(4px);
    text-transform:uppercase;
  }
  .badge.free{ border-color:rgba(226,31,61,0.6); background:rgba(226,31,61,0.85); color:#fff; }
  .badge.soon{ border-color:rgba(242,183,5,0.5); color:var(--cyan); }
  .badge.new{ left:10px; right:auto; border-color:rgba(46,204,113,0.6); background:rgba(46,204,113,0.85); color:#08210f; }

  .info{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .title{
    font-weight:700;
    font-size:16.5px;
    line-height:1.3;
  }
  .tags{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .tag{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:6px;
    background:rgba(226,31,61,0.12);
    color:#c4b5fd;
    border:1px solid rgba(226,31,61,0.25);
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .meta{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    margin-top:2px;
  }
  .meta span{display:flex;align-items:center;gap:4px;}

  .actions{
    display:flex; gap:6px; margin-top:auto; padding-top:10px;
  }
  .btn{
    flex:1;
    text-align:center;
    padding:9px 10px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    border:1px solid var(--line);
    color:var(--text);
    transition:all .2s ease;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .btn.steam{ background:rgba(255,255,255,0.03); }
  .btn.steam:hover{ border-color:var(--cyan); color:var(--cyan); }
  .btn.dl{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    color:var(--text);
  }
  .btn.dl:hover{ border-color:rgba(255,255,255,0.3); }
  .btn.trailer{
    flex:none;
    padding:9px 12px;
    background:rgba(255,255,255,0.03);
  }
  .btn.trailer:hover{ border-color:var(--cyan); color:var(--cyan); }
  .btn.disabled{
    opacity:0.45; pointer-events:none;
  }

  .empty{
    text-align:center; color:var(--muted); padding:80px 20px;
    display:none;
    font-family:'Inter',sans-serif; letter-spacing:.05em; font-size:13px;
  }

  footer{
    text-align:center; padding:30px 20px 50px;
    color:var(--muted); font-size:12px;
    position:relative; z-index:2;
    letter-spacing:.03em;
  }
  .version-tag{
    position:fixed;
    right:14px; bottom:10px;
    z-index:5;
    font-size:11px;
    color:var(--muted);
    opacity:0.55;
    letter-spacing:.03em;
    pointer-events:none;
  }

  /* ---- trailer modal ---- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    width:100%; max-width:640px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,0.6);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .modal-head .modal-title{ font-weight:700; font-size:15px; }
  .modal-close{
    background:none; border:none; color:var(--muted);
    font-size:20px; line-height:1; cursor:pointer;
    padding:4px 8px; border-radius:8px;
  }
  .modal-close:hover{ color:var(--text); background:rgba(255,255,255,0.06); }
  .modal-body{ background:#000; }
  .modal-body video{ width:100%; max-height:70vh; display:block; }
  .modal-fallback{ padding:36px 20px; text-align:center; color:var(--muted); font-size:13px; }

  @media (max-width:480px){
    header{padding:44px 6vw 20px;}
    .brand-logo{width:110px; height:110px;}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="gridlines"></div>
<div class="vignette"></div>
<div class="custom-wallpaper" id="customWallpaper"></div>

<div class="content">
  <button id="menuBtn" class="menu-btn" aria-label="Open menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <span>Wallpaper</span>
      <button id="drawerClose" class="drawer-close" aria-label="Close menu">✕</button>
    </div>
    <div class="drawer-body" id="wallpaperList"></div>
  </div>

  <header>
    <div class="brand-logo"><img src="favicon.jpg" alt="Pirack logo"></div>
    <h1>Pirack</h1>
    <div class="sub file-password">
      <span>File Password: <strong>www.pirategames.ir</strong></span>
      <button id="copyPassword" class="copy-btn" aria-label="Copy password" title="Copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap" id="searchWrap">
      <input id="search" type="text" placeholder="Search a game, genre...">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <div class="item-shop-card hidden" id="itemShopCard">
      <span class="shop-icon">🛒</span>
      <span class="shop-text">Item Shop</span>
      <span class="shop-badge">Coming Soon</span>
    </div>
  </div>

  <div class="view-tabs" id="viewTabs">
    <div class="thumb"></div>
    <button class="view-tab active" id="tabGames" data-view="games">Games</button>
    <button class="view-tab" id="tabApps" data-view="apps">Apps</button>
    <button class="view-tab" id="tabLeaderboard" data-view="leaderboard">Leaderboard</button>
  </div>

  <div class="count" id="count"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Nothing found 👀</div>

  <div class="lb-wrap hidden" id="lbWrap"></div>

  <footer>Built for our crew · Keep it between us 🎮</footer>
</div>

<div class="version-tag">v6.1</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">Trailer</span>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
let games = [];
let apps = [];

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function posterHTML(g){
  if(g.poster){
    return `<img src="${g.poster}" alt="${g.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  if(g.appid){
    const url = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`;
    return `<img src="${url}" alt="${g.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  return fallback(g.name);
}
function bannerHTML(g){
  if(g.appid){
    const url = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`;
    return `<img src="${url}" alt="${g.name}" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  return fallback(g.name);
}
function fallback(name){
  return `<div class="poster-fallback">${name}</div>`;
}

function render(list){
  const sorted = [...list].sort((a,b) => (b.isNew?1:0) - (a.isNew?1:0));
  grid.innerHTML = sorted.map(g => `
    <div class="card">
      <div class="poster-wrap">
        ${posterHTML(g)}
        ${g.isNew ? '<div class="badge new">New</div>' : ''}
        ${g.comingSoon ? '<div class="badge soon">Coming Soon</div>' : g.free ? '<div class="badge free">Free</div>' : ''}
      </div>
      <div class="info">
        <div class="title">${g.name}</div>
        <div class="tags">${g.genres.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="meta">
          <span>👥 ${g.players}</span>
          <span>💾 ${g.size}</span>
        </div>
        <div class="actions">
          <a class="btn steam" href="${g.steam}" target="_blank" rel="noopener">${g.storeLabel || 'Steam'}</a>
          ${g.comingSoon
            ? `<a class="btn dl disabled" href="#">Soon</a>`
            : `<a class="btn dl" href="${g.dl}" target="_blank" rel="noopener">${g.free ? 'Free' : 'PirateGames'}</a>`
          }
          ${g.dl2
            ? `<a class="btn trailer" href="${g.dl2}" target="_blank" rel="noopener" aria-label="Download">⬇</a>`
            : `<button class="btn trailer disabled" aria-label="Download">⬇</button>`
          }
          <button class="btn trailer" onclick="openTrailer('${g.slug}')" aria-label="Watch trailer">▶</button>
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `${list.length} games`;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function renderApps(list){
  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="poster-wrap">
        ${a.poster ? `<img src="${a.poster}" alt="${a.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${a.name.replace(/'/g,"\\'")}')">` : fallback(a.name)}
      </div>
      <div class="info">
        <div class="title">${a.name}</div>
        <div class="actions">
          ${a.dl
            ? `<a class="btn dl" href="${a.dl}" target="_blank" rel="noopener" style="flex:1;">Download</a>`
            : `<a class="btn dl disabled" href="#" style="flex:1;">Soon</a>`
          }
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `${list.length} apps`;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

let currentView = 'games';
let leaderboard = [];

function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  if(currentView === 'games'){
    const filtered = games.filter(g =>
      g.name.toLowerCase().includes(q) ||
      g.genres.some(t=>t.toLowerCase().includes(q))
    );
    render(filtered);
  } else if(currentView === 'apps') {
    const filtered = apps.filter(a => a.name.toLowerCase().includes(q));
    renderApps(filtered);
  }
}

function initials(name){
  return (name||'?').trim().slice(0,1).toUpperCase();
}

function renderLeaderboard(){
  const lbWrap = document.getElementById('lbWrap');
  const sorted = [...leaderboard].sort((a,b) => (b.score||0) - (a.score||0));

  if(sorted.length === 0){
    lbWrap.innerHTML = `<div class="lb-empty">No scores yet.</div>`;
    return;
  }

  const top3 = sorted.slice(0,3);
  const rest = sorted.slice(3);

  const avatarHTML = (p, sizeClass) => p.avatar
    ? `<img src="${p.avatar}" alt="${p.player}">`
    : initials(p.player);

  const podiumOrder = [top3[1], top3[0], top3[2]]; // rank2, rank1, rank3 (missing ones skipped)
  const podiumHTML = podiumOrder.map((p, idx) => {
    if(!p) return '';
    const rank = top3.indexOf(p) + 1;
    return `
      <div class="podium-card rank-${rank}">
        <div class="podium-avatar">${avatarHTML(p)}</div>
        <div class="podium-name">${p.player}</div>
        <div class="podium-badge">🏆 ${p.score} Score</div>
        <div class="podium-platform">
          <div class="podium-prize">💎 ${(p.score||0)*5}</div>
          <div class="podium-prize-label">Prize</div>
        </div>
      </div>
    `;
  }).join('');

  const listHTML = rest.length ? `
    <div class="lb-head">
      <div style="width:26px;"></div>
      <div style="width:38px;"></div>
      <div style="flex:1;">Username</div>
      <div class="lb-col-score">Score</div>
      <div style="width:90px; text-align:right;">Prize</div>
    </div>
    <div class="lb-table">
      ${rest.map((p, i) => `
        <div class="lb-row">
          <div class="lb-rank">🏆 ${i+4}</div>
          <div class="lb-avatar">${avatarHTML(p)}</div>
          <div class="lb-player">${p.player}</div>
          <div class="lb-col-score">${p.score}</div>
          <div class="lb-col-prize">💎 ${(p.score||0)*5}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  lbWrap.innerHTML = `<div class="podium">${podiumHTML}</div>${listHTML}`;
}

document.getElementById('search').addEventListener('input', applyFilter);

const viewTabs = document.getElementById('viewTabs');
const tabGames = document.getElementById('tabGames');
const tabApps = document.getElementById('tabApps');
const tabLeaderboard = document.getElementById('tabLeaderboard');
const searchInput = document.getElementById('search');
const toolbarEl = document.querySelector('.toolbar');
const gridEl = document.getElementById('grid');
const lbWrapEl = document.getElementById('lbWrap');
const searchWrapEl = document.getElementById('searchWrap');
const itemShopEl = document.getElementById('itemShopCard');

function switchView(view){
  currentView = view;
  viewTabs.classList.remove('apps-active','leaderboard-active');
  if(view === 'apps') viewTabs.classList.add('apps-active');
  if(view === 'leaderboard') viewTabs.classList.add('leaderboard-active');
  tabGames.classList.toggle('active', view === 'games');
  tabApps.classList.toggle('active', view === 'apps');
  tabLeaderboard.classList.toggle('active', view === 'leaderboard');
  searchInput.value = '';

  if(view === 'leaderboard'){
    searchWrapEl.classList.add('hidden');
    itemShopEl.classList.remove('hidden');
    document.getElementById('count').classList.add('hidden');
    gridEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    lbWrapEl.classList.remove('hidden');
    renderLeaderboard();
  } else {
    searchWrapEl.classList.remove('hidden');
    itemShopEl.classList.add('hidden');
    document.getElementById('count').classList.remove('hidden');
    gridEl.classList.remove('hidden');
    lbWrapEl.classList.add('hidden');
    searchInput.placeholder = view === 'games' ? 'Search a game, genre...' : 'Search an app...';
    applyFilter();
  }
}
tabGames.addEventListener('click', () => switchView('games'));
tabApps.addEventListener('click', () => switchView('apps'));
tabLeaderboard.addEventListener('click', () => switchView('leaderboard'));

let wallpapers = [];

async function loadData(){
  try{
    const [gamesRes, appsRes, lbRes, wpRes] = await Promise.all([
      fetch('games.json?t=' + Date.now()),
      fetch('apps.json?t=' + Date.now()),
      fetch('leaderboard.json?t=' + Date.now()),
      fetch('wallpapers.json?t=' + Date.now())
    ]);
    games = await gamesRes.json();
    apps = await appsRes.json();
    leaderboard = lbRes.ok ? await lbRes.json() : [];
    wallpapers = wpRes.ok ? await wpRes.json() : [];
  }catch(err){
    countEl.textContent = 'Failed to load data.';
    console.error(err);
    return;
  }
  games.forEach(g => g.slug = slug(g.name));
  apps.forEach(a => a.slug = slug(a.name));
  render(games);
  initWallpapers();
}
loadData();

// --- wallpaper picker ---
function isVideoFile(path){
  return /\.(mp4|webm|mov)$/i.test(path||'');
}
function getSavedWallpaper(){
  try{ return JSON.parse(localStorage.getItem('pirack_wallpaper_v2') || 'null'); }
  catch(e){ return null; }
}
function saveWallpaper(id, file){
  localStorage.setItem('pirack_wallpaper_v2', JSON.stringify({id, file}));
}
function applyWallpaperMedia(file, name){
  const customEl = document.getElementById('customWallpaper');
  if(!file){
    customEl.classList.remove('active');
    customEl.innerHTML = '';
    return;
  }
  customEl.innerHTML = isVideoFile(file)
    ? `<video src="${file}" muted loop autoplay playsinline></video>`
    : `<img src="${file}" alt="${name||''}">`;
  customEl.classList.add('active');
}
// apply immediately, before games/apps/wallpapers.json finish loading, to avoid a flash
(function(){
  const saved = getSavedWallpaper();
  if(saved && saved.file) applyWallpaperMedia(saved.file, saved.id);
})();

function renderWallpaperList(){
  const saved = getSavedWallpaper();
  const currentId = saved ? saved.id : 'default';
  const list = document.getElementById('wallpaperList');
  const options = [{id:'default', name:'Default', file:null}, ...wallpapers];
  list.innerHTML = options.map(w => `
    <div class="wp-option ${currentId===w.id ? 'selected':''}" data-id="${w.id}" data-file="${w.file||''}" data-name="${w.name}">
      <div class="wp-thumb">
        ${w.file
          ? (isVideoFile(w.file) ? `<video src="${w.file}" muted loop autoplay playsinline></video>` : `<img src="${w.file}" alt="${w.name}">`)
          : '✨'}
      </div>
      <div class="wp-name">${w.name}</div>
      <div class="wp-check">✓</div>
    </div>
  `).join('');
  list.querySelectorAll('.wp-option').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const file = el.dataset.file || null;
      saveWallpaper(id, file);
      applyWallpaperMedia(file, id);
      renderWallpaperList();
    });
  });
}
function initWallpapers(){
  // re-validate the saved selection now that wallpapers.json is loaded
  // (in case it was removed from admin) and sync the media if it changed
  const saved = getSavedWallpaper();
  if(saved && saved.id !== 'default'){
    const stillExists = wallpapers.find(w => w.id === saved.id);
    if(!stillExists){
      saveWallpaper('default', null);
      applyWallpaperMedia(null);
    }
  }
  renderWallpaperList();
}

const menuBtn = document.getElementById('menuBtn');
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
function openDrawer(){ drawer.classList.add('open'); drawerOverlay.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }
menuBtn.addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

const copyBtn = document.getElementById('copyPassword');
copyBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText('www.pirategames.ir');
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = 'www.pirategames.ir';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  copyBtn.classList.add('copied');
  setTimeout(() => copyBtn.classList.remove('copied'), 1200);
});

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

function openTrailer(gameSlug){
  const g = games.find(x => x.slug === gameSlug);
  if(!g) return;
  modalTitle.textContent = `${g.name} — Trailer`;
  const path = `trailers/${g.slug}.mp4`;
  modalBody.innerHTML = `<video src="${path}" controls autoplay playsinline onerror="this.outerHTML='<div class=&quot;modal-fallback&quot;>No trailer uploaded yet for this game.<br>Expected file: trailers/${g.slug}.mp4</div>'"></video>`;
  modalOverlay.classList.add('open');
}
function closeTrailer(){
  modalOverlay.classList.remove('open');
  const v = modalBody.querySelector('video');
  if(v) v.pause();
  modalBody.innerHTML = '';
}
document.getElementById('modalClose').addEventListener('click', closeTrailer);
modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) closeTrailer(); });
window.addEventListener('keydown', e => { if(e.key === 'Escape') closeTrailer(); });

/* ---- live wallpaper: drifting embers over dark void, subtle parallax ---- */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W,H,particles=[];
let mx=0.5,my=0.5;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function makeParticle(){
  return {
    x: Math.random()*W,
    y: H + Math.random()*100,
    r: Math.random()*2 + 0.6,
    speed: Math.random()*0.6 + 0.15,
    drift: (Math.random()-0.5)*0.4,
    hue: Math.random() > 0.5 ? 'violet' : 'cyan',
    alpha: Math.random()*0.5 + 0.2,
    flicker: Math.random()*0.02 + 0.005
  };
}
const COUNT = Math.min(120, Math.floor((window.innerWidth*window.innerHeight)/14000));
for(let i=0;i<COUNT;i++){
  const p = makeParticle();
  p.y = Math.random()*H;
  particles.push(p);
}

window.addEventListener('mousemove', e=>{
  mx = e.clientX / window.innerWidth;
  my = e.clientY / window.innerHeight;
});

function draw(){
  ctx.clearRect(0,0,W,H);

  const gx = W * (0.3 + mx*0.4);
  const gy = H * (0.2 + my*0.3);
  const grad = ctx.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*0.6);
  grad.addColorStop(0,'rgba(226,31,61,0.06)');
  grad.addColorStop(0.5,'rgba(242,183,5,0.025)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  const parX = (mx-0.5)*20;

  particles.forEach(p=>{
    p.y -= p.speed;
    p.x += p.drift;
    p.alpha += (Math.random()-0.5)*p.flicker;
    p.alpha = Math.max(0.1, Math.min(0.7, p.alpha));
    if(p.y < -10){
      p.y = H + 10;
      p.x = Math.random()*W;
    }
    const color = p.hue === 'violet' ? `226,31,61` : `242,183,5`;
    ctx.beginPath();
    ctx.arc(p.x + parX, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color},${p.alpha})`;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(${color},0.6)`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
