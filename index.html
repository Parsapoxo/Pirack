<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirack</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --surface:#121213;
    --surface-2:#18181a;
    --line:#26262a;
    --text:#f2f2f3;
    --muted:#8f8f96;
    --violet:#e21f3d;
    --cyan:#f2b705;
    --gold:#f2b705;
    --ember:#ff3b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  canvas#bg{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0;
    display:block;
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, transparent 0%, rgba(12,6,7,0.55) 70%, rgba(12,6,7,0.95) 100%);
  }
  .gridlines{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:
      linear-gradient(rgba(226,31,61,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,31,61,0.06) 1px, transparent 1px);
    background-size:42px 42px;
    background-position:center center;
    -webkit-mask-image:radial-gradient(ellipse at 50% 20%, black 0%, transparent 75%);
    mask-image:radial-gradient(ellipse at 50% 20%, black 0%, transparent 75%);
  }
  .content{ position:relative; z-index:2; }

  .menu-btn{
    position:fixed;
    top:18px; right:18px;
    z-index:40;
    width:42px; height:42px;
    border-radius:11px;
    background:rgba(18,18,19,0.85);
    border:1px solid var(--line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color .2s, color .2s;
  }
  .menu-btn:hover{ border-color:var(--violet); color:var(--violet); }
  .menu-btn svg{ width:20px; height:20px; }

  .bell-btn{
    position:fixed;
    top:18px; right:68px;
    z-index:40;
    width:42px; height:42px;
    border-radius:11px;
    background:rgba(18,18,19,0.85);
    border:1px solid var(--line);
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color .2s, color .2s;
  }
  .bell-btn:hover{ border-color:var(--violet); color:var(--text); }
  .bell-btn svg{ width:20px; height:20px; transform-origin:50% 10%; }
  .bell-dot{
    display:none;
    position:absolute; top:7px; right:8px;
    width:10px; height:10px; border-radius:50%;
    background:var(--violet);
    border:2px solid #121213;
    box-sizing:content-box;
  }
  .bell-btn.alert{ color:var(--text); }
  .bell-btn.alert .bell-dot{ display:block; animation:bellPulse 1.4s ease-in-out infinite; }
  .bell-btn.alert svg{ animation:bellSwing 2.8s ease-in-out infinite; }
  @keyframes bellPulse{
    0%,100%{ transform:scale(1); opacity:1; box-shadow:0 0 0 0 rgba(229,57,70,.55); }
    50%{ transform:scale(1.25); opacity:.8; box-shadow:0 0 0 6px rgba(229,57,70,0); }
  }
  @keyframes bellSwing{
    0%,60%,100%{ transform:rotate(0); }
    66%{ transform:rotate(14deg); } 72%{ transform:rotate(-12deg); }
    78%{ transform:rotate(8deg); } 84%{ transform:rotate(-5deg); } 90%{ transform:rotate(0); }
  }
  @media (prefers-reduced-motion:reduce){
    .bell-btn.alert .bell-dot, .bell-btn.alert svg{ animation:none; }
  }
  .ann-title{ font-size:21px; font-weight:800; line-height:1.3; margin-bottom:12px; overflow-wrap:anywhere; }
  .ann-text{ font-size:14px; line-height:1.7; color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; }
  #annBody{ max-height:65vh; overflow-y:auto; padding-right:2px; }
  .ann-item{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .ann-item + .ann-item{ margin-top:12px; }
  .ann-item .ann-title{ display:flex; align-items:flex-start; gap:8px; }
  .ann-new{
    flex:none; margin-top:4px;
    font-size:9.5px; font-weight:800; letter-spacing:.06em;
    padding:3px 7px; border-radius:999px;
    background:var(--violet); color:#fff;
  }
  .ann-meta{ display:flex; justify-content:flex-end; margin-top:12px; font-size:11px; color:var(--muted); opacity:.85; }
  .ann-empty{ font-size:14px; color:var(--muted); text-align:center; padding:18px 0; }

  .profile-btn{
    position:fixed;
    top:18px; right:118px;
    z-index:40;
    width:42px; height:42px;
    border-radius:14px;
    background:rgba(18,18,19,0.85);
    border:1px solid var(--line);
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    overflow:hidden;
    transition:border-color .2s;
  }
  .profile-btn:hover{ border-color:var(--violet); }
  .profile-btn svg{ width:20px; height:20px; }
  .profile-btn img{ width:100%; height:100%; object-fit:cover; }

  .drawer-overlay{
    position:fixed; inset:0; z-index:49;
    background:rgba(0,0,0,0.6);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed;
    top:0; right:0; bottom:0;
    z-index:50;
    width:300px;
    max-width:85vw;
    background:var(--surface);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
    display:flex;
    flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    font-weight:700;
    font-size:15px;
  }
  .drawer-close{
    background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer;
  }
  .drawer-close:hover{ color:var(--text); }
  .drawer-body{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .wp-option{
    display:flex; align-items:center; gap:12px;
    padding:9px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface-2);
    cursor:pointer;
    transition:border-color .2s;
  }
  .wp-option:hover{ border-color:rgba(255,255,255,0.25); }
  .wp-option.selected{ border-color:var(--violet); box-shadow:0 0 0 1px var(--violet); }
  .wp-thumb{
    width:52px; height:36px;
    border-radius:7px;
    overflow:hidden;
    flex-shrink:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .wp-thumb img, .wp-thumb video{ width:100%; height:100%; object-fit:cover; }
  .wp-name{ flex:1; font-size:14px; font-weight:600; }
  .wp-check{ color:var(--violet); font-size:14px; opacity:0; }
  .wp-option.selected .wp-check{ opacity:1; }

  .custom-wallpaper{
    position:fixed; inset:0; z-index:0;
    display:none;
  }
  .custom-wallpaper.active{ display:block; }
  .custom-wallpaper img, .custom-wallpaper video{
    width:100%; height:100%; object-fit:cover;
  }


  header{
    padding:56px 6vw 10px;
    text-align:center;
  }
  .brand-logo{
    width:160px; height:160px;
    border-radius:22px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#000;
    margin:0 auto 18px;
  }
  .brand-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  h1{
    font-family:'Inter',sans-serif;
    font-weight:900;
    font-size:clamp(32px,6vw,50px);
    letter-spacing:0.03em;
    color:var(--violet);
    line-height:1;
  }
  .sub{
    margin-top:14px;
    color:var(--muted);
    font-size:15px;
    max-width:420px;
    margin-inline:auto;
    letter-spacing:0.02em;
  }
  .sub.file-password{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    max-width:none;
  }
  .sub.file-password strong{ color:var(--text); font-weight:700; }
  .copy-btn{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    color:var(--muted);
    width:28px; height:28px;
    border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:color .2s, border-color .2s, background .2s;
  }
  .copy-btn svg{ width:14px; height:14px; }
  .copy-btn:hover{ color:var(--text); border-color:rgba(255,255,255,0.25); }
  .copy-btn.copied{ color:#2ecc71; border-color:rgba(46,204,113,0.5); }

  .toolbar{
    max-width:1100px;
    margin:8px auto 8px;
    padding:0 6vw;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }
  .item-shop-card{
    position:relative;
    flex:1 1 340px;
    max-width:480px;
    height:48px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:0 18px;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(226,31,61,0.12), rgba(242,183,5,0.08));
    border:1px solid rgba(242,183,5,0.35);
    overflow:hidden;
    cursor:pointer;
    transition:border-color .3s ease, box-shadow .3s ease, filter .3s ease;
  }
  .item-shop-card:hover{
    border-color:rgba(242,183,5,0.65);
    box-shadow:0 0 0 1px rgba(242,183,5,0.25);
    filter:brightness(1.12);
  }
  .item-shop-card::before{
    content:'';
    position:absolute;
    inset:-40%;
    background:radial-gradient(circle, rgba(242,183,5,0.25), transparent 60%);
    animation:shopGlow 3.2s ease-in-out infinite;
  }
  @keyframes shopGlow{
    0%, 100%{ opacity:0.5; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  .item-shop-card .shop-icon{
    font-size:19px;
    position:relative; z-index:1;
  }
  .item-shop-card .shop-text{
    position:relative; z-index:1;
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .item-shop-card .shop-badge{
    position:relative; z-index:1;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(242,183,5,0.5);
    border-radius:999px;
    padding:3px 9px;
  }
  .search-wrap{
    position:relative;
    flex:1 1 340px;
    max-width:480px;
  }
  .search-wrap svg{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--muted);
  }
  #search{
    width:100%;
    height:48px;
    box-sizing:border-box;
    padding:0 18px 0 46px;
    background:rgba(17,17,25,0.8);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:500;
    backdrop-filter:blur(8px);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{border-color:var(--violet); box-shadow:0 0 0 3px rgba(226,31,61,0.18);}

  .count{
    font-size:13px; color:var(--muted); text-align:center; margin:14px 0 8px;
    font-family:'Inter',sans-serif; letter-spacing:0.05em;
  }

  .view-tabs{
    position:relative;
    box-sizing:border-box;
    width:100%;
    max-width:min(420px, calc(100% - 12vw));
    margin:20px auto 0;
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    transition:opacity .18s ease, transform .18s ease;
  }
  .view-tabs.swapping{ opacity:0; transform:scale(0.97); }

  .main-menu-pill{
    display:none;
    max-width:min(420px, calc(100% - 12vw));
    width:100%;
    height:48px;
    box-sizing:border-box;
    margin:0 auto 16px;
    padding:0 18px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:.04em;
    transition:color .5s ease, border-color .5s ease, background-color .5s ease;
  }
  .main-menu-pill:hover{
    color:var(--text);
    border-color:rgba(255,255,255,0.28);
    background-color:rgba(255,255,255,0.06);
  }
  .main-menu-pill.visible{ display:flex; }

  .shop-wrap{ max-width:900px; margin:28px auto 0; padding:0 6vw 60px; }
  .shop-tier{ margin-bottom:36px; animation:shopFadeIn .4s ease both; }
  .shop-tier-head{
    display:flex; align-items:center; gap:12px;
    margin-bottom:16px;
  }
  .shop-tier-head::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }
  .shop-tier-name{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-shadow:0 0 18px currentColor;
  }
  .shop-tier-price{
    font-size:11.5px;
    font-weight:700;
    color:var(--gold);
    background:rgba(242,183,5,0.08);
    border:1px solid rgba(242,183,5,0.3);
    padding:4px 11px;
    border-radius:999px;
    flex-shrink:0;
  }
  @keyframes shopFadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:14px;
  }
  .title-card{
    padding:16px 12px;
    border-radius:16px;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    position:relative;
  }
  .title-card:hover{
    transform:translateY(-4px);
    border-color:rgba(226,31,61,0.45);
    box-shadow:0 14px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(242,183,5,0.12);
  }
  .title-card .tname{ font-weight:800; font-size:13.5px; }
  .title-card .tbuy{
    width:100%;
    padding:8px;
    border-radius:9px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, color .2s ease, transform .15s ease;
  }
  .title-card .tbuy:hover{ border-color:var(--gold); color:var(--gold); background:rgba(242,183,5,0.08); }
  .title-card .tbuy:active{ transform:scale(0.97); }
  .title-card .tbuy.owned{ background:rgba(46,204,113,0.15); border-color:rgba(46,204,113,0.4); color:#2ecc71; cursor:default; transform:none; }
  .title-card .tbuy.owned:hover{ border-color:rgba(46,204,113,0.4); color:#2ecc71; background:rgba(46,204,113,0.15); }
  .title-card .tbuy.cant-afford{ opacity:0.5; }

  /* tier colors */
  .tier-common .tname, .bname.tier-common, .lb-title.tier-common .tname{ color:#8ecbf5; }
  .tier-common .shop-tier-name{ color:#8ecbf5; }
  .tier-rare .tname, .bname.tier-rare, .lb-title.tier-rare .tname{ color:#3f7fe0; }
  .tier-rare .shop-tier-name{ color:#3f7fe0; }
  .tier-epic .tname, .bname.tier-epic, .lb-title.tier-epic .tname{ color:#b566f2; }
  .tier-epic .shop-tier-name{ color:#b566f2; }
  .tier-legendary .tname, .bname.tier-legendary, .lb-title.tier-legendary .tname{ color:var(--gold); }
  .tier-legendary .shop-tier-name{ color:var(--gold); }
  .tier-champion .tname, .tier-champion .shop-tier-name, .bname.tier-champion, .lb-title.tier-champion .tname{
    background:linear-gradient(90deg,#ff3b3b,#f2b705,#2ecc71,#3f7fe0,#b566f2,#ff3b3b);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:championShift 4s linear infinite;
  }
  @keyframes championShift{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }

  .shop-status-bar{
    text-align:center;
    margin:0 0 26px;
    padding:12px 20px;
    border-radius:999px;
    background:linear-gradient(135deg, rgba(226,31,61,0.1), rgba(242,183,5,0.06));
    border:1px solid rgba(242,183,5,0.25);
    color:var(--muted);
    font-size:13px;
    animation:shopFadeIn .4s ease both;
  }
  .shop-status-bar strong{ font-weight:800; }

  .coming-soon-panel{
    position:relative;
    max-width:500px; margin:60px auto; padding:44px 24px;
    text-align:center;
    border:1px solid rgba(242,183,5,0.25);
    border-radius:18px;
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    overflow:hidden;
    animation:shopFadeIn .4s ease both;
  }
  .coming-soon-panel::before{
    content:'';
    position:absolute;
    inset:-60%;
    background:radial-gradient(circle, rgba(242,183,5,0.16), transparent 60%);
    animation:shopGlow 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  .coming-soon-panel > *{ position:relative; z-index:1; }

  .banner-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .banner-card{
    border-radius:16px;
    overflow:hidden;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .banner-card:hover{
    transform:translateY(-4px);
    border-color:rgba(226,31,61,0.45);
    box-shadow:0 14px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(242,183,5,0.12);
  }
  .banner-card{
    content-visibility:auto;
    contain-intrinsic-size:auto 160px;
  }
  .banner-card .bimg-wrap{
    width:100%; aspect-ratio:5/1;
    background:linear-gradient(90deg, #0d0d0f 0%, #1a1a1d 50%, #0d0d0f 100%);
    background-size:200% 100%;
    animation:bannerShimmer 1.6s linear infinite;
    overflow:hidden;
  }
  .banner-card .bimg-wrap img, .banner-card .bimg-wrap video{ width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  .banner-card .bimg-wrap.loaded{ animation:none; background:#000; }
  .lb-banner-img video{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes bannerShimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }
  .banner-card .binfo{ padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .banner-card .bname{ font-weight:800; font-size:13.5px; }
  .banner-card .bcat{
    display:inline-block;
    font-size:10.5px; font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    width:fit-content;
    border:1px solid currentColor;
  }
  .banner-card .bbuy{
    margin-top:2px;
    padding:8px;
    border-radius:9px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, color .2s ease, transform .15s ease;
  }
  .banner-card .bbuy:hover{ border-color:var(--gold); color:var(--gold); background:rgba(242,183,5,0.08); }
  .banner-card .bbuy:active{ transform:scale(0.97); }
  .banner-card .bbuy.owned{ background:rgba(46,204,113,0.15); border-color:rgba(46,204,113,0.4); color:#2ecc71; cursor:default; }

<script>
let games = [];
let apps = [];

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function getDlParts(g){
  if(Array.isArray(g.dl2Parts) && g.dl2Parts.filter(Boolean).length){
    return g.dl2Parts.filter(Boolean);
  }
  if(g.dl2) return [g.dl2];
  return [];
}
function dlPartsHTML(g){
  const parts = getDlParts(g);
  if(parts.length === 0) return '';
  if(parts.length === 1){
    return `<a class="btn trailer" href="${parts[0]}" target="_blank" rel="noopener" aria-label="Download">⬇</a>`;
  }
  const menuId = `dlmenu-${g.slug}`;
  return `
    <div class="dl-parts-wrap">
      <button class="btn trailer" aria-label="Download parts" onclick="toggleDlParts('${menuId}', event)">⬇</button>
      <div class="dl-parts-menu" id="${menuId}">
        ${parts.map((url,i) => `<a href="${url}" target="_blank" rel="noopener">Part ${i+1}</a>`).join('')}
      </div>
    </div>
  `;
}

function posterHTML(g){
  if(g.poster){
    return `<img src="${g.poster}" alt="${g.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  if(g.appid){
    const url = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`;
    return `<img src="${url}" alt="${g.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  return fallback(g.name);
}
function bannerHTML(g){
  if(g.appid){
    const url = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`;
    return `<img src="${url}" alt="${g.name}" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  return fallback(g.name);
}
function fallback(name){
  return `<div class="poster-fallback">${name}</div>`;
}

function render(list){
  const sorted = [...list].sort((a,b) => (b.isNew?1:0) - (a.isNew?1:0));
  grid.innerHTML = sorted.map(g => `
    <div class="card">
      <div class="poster-wrap">
        ${posterHTML(g)}
        ${g.isNew ? '<div class="badge new">New</div>' : ''}
        ${g.comingSoon ? '<div class="badge soon">Coming Soon</div>' : g.free ? '<div class="badge free">Free</div>' : ''}
      </div>
      <div class="info">
        <div class="title">${g.name}</div>
        <div class="tags">${g.genres.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="meta">
          <span>👥 ${g.players}</span>
          <span>💾 ${g.size}</span>
        </div>
        <div class="actions">
          ${g.steam ? `<a class="btn steam" href="${g.steam}" target="_blank" rel="noopener">${g.storeLabel || 'Steam'}</a>` : ''}
          ${g.comingSoon
            ? `<a class="btn dl disabled" href="#">Soon</a>`
            : (g.dl ? `<a class="btn dl" href="${g.dl}" target="_blank" rel="noopener">${g.free ? 'Free' : 'PirateGames'}</a>` : '')
          }
          ${dlPartsHTML(g)}
          <button class="btn trailer" onclick="openTrailer('${g.slug}')" aria-label="Watch trailer">▶</button>
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `${list.length} games`;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function renderApps(list){
  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="poster-wrap">
        ${a.poster ? `<img src="${a.poster}" alt="${a.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${a.name.replace(/'/g,"\\'")}')">` : fallback(a.name)}
      </div>
      <div class="info">
        <div class="title">${a.name}</div>
        <div class="actions">
          ${a.dl
            ? `<a class="btn dl" href="${a.dl}" target="_blank" rel="noopener" style="flex:1;">Download</a>`
            : `<a class="btn dl disabled" href="#" style="flex:1;">Soon</a>`
          }
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `${list.length} apps`;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

const TITLE_TIERS = [
  {key:'champion', label:'Champion', price:1000, names:['Cyberdemon','The Unbroken','Flawless','Demigod','Immortal','Grandmaster','Warlord','Nightmare','War Machine','Deadeye']},
  {key:'legendary', label:'Legendary', price:800, names:['Mastermind','Unbreakable','Most Wanted','The Captain','Headshot Only','Titan','Ravager','The Warden','Shapeshifter','Assassin']},
  {key:'epic', label:'Epic', price:600, names:['Cyberninja','Hacker','The Collector','Renegade','Mad Scientist','The Sniper','Engineer','Philosopher','Cool Cat','Overlord']},
  {key:'rare', label:'Rare', price:400, names:['The Untamed','Gunslinger','Expert Competitor','Stalwart Hero','Adept Competitor','Knight','Bulldozer','Duality','The Bear','Squire']},
  {key:'common', label:'Common', price:200, names:['DJ','Scientist','Naturalist','Gorgeous','The Pretty','Boom!','Big Guy','Proud','Rookie','Lost']}
];
function titleSlug(str){ return String(str).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function titleId(tierKey, name){ return `${tierKey}-${titleSlug(name)}`; }
function findTitleById(id){
  for(const tier of TITLE_TIERS){
    for(const name of tier.names){
      if(titleId(tier.key, name) === id) return { tier: tier.key, price: tier.price, name };
    }
  }
  return null;
}
function findBannerById(id){
  return banners.find(b => b.id === id) || null;
}
function findProfilePicById(id){
  return profilePics.find(p => p.id === id) || null;
}
const AVATAR_UPLOAD_COST = 1500;
function totalOwnedSpend(ownedTitles, ownedBanners, ownedProfilePics, avatarSpend){
  const titleSpend = (ownedTitles||[]).reduce((sum,id) => { const t = findTitleById(id); return sum + (t ? t.price : 0); }, 0);
  const bannerSpend = (ownedBanners||[]).reduce((sum,id) => { const b = findBannerById(id); return sum + (b ? (b.price||0) : 0); }, 0);
  const picSpend = (ownedProfilePics||[]).reduce((sum,id) => { const p = findProfilePicById(id); return sum + (p ? (p.price||0) : 0); }, 0);
  return titleSpend + bannerSpend + picSpend + (avatarSpend||0);
}

let currentView = 'games';
let leaderboard = [];
let banners = [];
let bannerCategories = [];
let profilePics = [];
let profilePicCategories = [];
let shopMode = false;
let currentPlayerTitles = { ownedTitles: [], selectedTitle: null, ownedBanners: [], selectedBanner: null, ownedProfilePics: [], selectedProfilePic: null, avatarSpend: 0 };
let allPlayerData = {};

function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  if(currentView === 'games'){
    const filtered = games.filter(g =>
      g.name.toLowerCase().includes(q) ||
      g.genres.some(t=>t.toLowerCase().includes(q))
    );
    render(filtered);
  } else if(currentView === 'apps') {
    const filtered = apps.filter(a => a.name.toLowerCase().includes(q));
    renderApps(filtered);
  }
}

function initials(name){
  return (name||'?').trim().slice(0,1).toUpperCase();
}

async function renderLeaderboard(){
  const lbWrap = document.getElementById('lbWrap');
  const sorted = [...leaderboard].sort((a,b) => (b.score||0) - (a.score||0));

  if(sorted.length === 0){
    lbWrap.innerHTML = `<div class="lb-empty">No scores yet.</div>`;
    return;
  }

  if(window.pirackDB){
    try{ allPlayerData = await window.pirackDB.getAllPlayerData(); }
    catch(err){ console.error(err); }
  }

  const top3 = sorted.slice(0,3);
  const rest = sorted.slice(3);

  const avatarHTML = (p, sizeClass) => {
    const data = allPlayerData[slug(p.player)];
    const selectedPic = data && data.selectedProfilePic ? findProfilePicById(data.selectedProfilePic) : null;
    if(selectedPic && selectedPic.file) return `<img src="${selectedPic.file}" alt="${p.player}">`;
    if(p.avatar) return `<img src="${p.avatar}" alt="${p.player}">`;
    return initials(p.player);
  };

  function playerTitleHTML(p){
    const data = allPlayerData[slug(p.player)];
    const selected = data && data.selectedTitle ? findTitleById(data.selectedTitle) : null;
    if(!selected) return '';
    return `<div class="lb-title tier-${selected.tier}"><span class="tname">${esc(selected.name)}</span></div>`;
  }
  function getPlayerBanner(p){
    const data = allPlayerData[slug(p.player)];
    const selected = data && data.selectedBanner ? findBannerById(data.selectedBanner) : null;
    return selected && selected.file ? selected : null;
  }

  const MEDALS = { 1:'🥇 1ST', 2:'🥈 2ND', 3:'🥉 3RD' };
  function podiumCardHTML(p, rank){
    const banner = getPlayerBanner(p);
    return `
      <div class="pc rank-${rank}">
        <div class="pc-banner">
          ${banner ? bannerMediaHTML(banner.file, banner.name, rank === 1) : ''}
          <div class="pc-medal">${MEDALS[rank]}</div>
        </div>
        <div class="pc-avatar">${avatarHTML(p)}</div>
        <div class="pc-info">
          <div class="pc-name" title="${esc(p.player)}">${esc(p.player)}</div>
          ${playerTitleHTML(p)}
          <div class="pc-score">🏆 ${p.score} Score</div>
        </div>
      </div>
    `;
  }
  const lowerCards = [top3[1], top3[2]].map((p, k) => p ? podiumCardHTML(p, k + 2) : '').join('');
  const podiumHTML = podiumCardHTML(top3[0], 1) + (lowerCards.trim() ? `<div class="pc-row">${lowerCards}</div>` : '');

  function rowHTML(p, i){
    const banner = getPlayerBanner(p);
    if(banner){
      return `
        <div class="lb-banner-strip">
          <div class="lb-banner-avatar">${avatarHTML(p)}</div>
          <div class="lb-banner-img">
            ${bannerMediaHTML(banner.file, banner.name, false)}
            <div class="lb-banner-overlay">
              <div class="lb-banner-namecol">
                <div class="lb-player">${esc(p.player)}</div>
                ${playerTitleHTML(p)}
                <div class="lb-score">🏆 ${p.score} Score</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
    return `
      <div class="lb-row">
        <div class="lb-rank">🏆 ${i+4}</div>
        <div class="lb-avatar">${avatarHTML(p)}</div>
        <div class="lb-player-col">
          <div class="lb-player">${esc(p.player)}</div>
          ${playerTitleHTML(p)}
          <div class="lb-score">${p.score} Score</div>
        </div>
      </div>
    `;
  }

  const listHTML = rest.length ? `
    <div class="lb-table">
      ${rest.map((p, i) => rowHTML(p, i)).join('')}
    </div>
  ` : '';

  lbWrap.innerHTML = `<div class="podium2">${podiumHTML}</div>${listHTML}`;
  observeBannerMedia(lbWrap);
}

document.getElementById('search').addEventListener('input', applyFilter);

const viewTabs = document.getElementById('viewTabs');
const tabGames = document.getElementById('tabGames');
const tabApps = document.getElementById('tabApps');
const tabLeaderboard = document.getElementById('tabLeaderboard');
const searchInput = document.getElementById('search');
const toolbarEl = document.querySelector('.toolbar');
const gridEl = document.getElementById('grid');
const lbWrapEl = document.getElementById('lbWrap');
const searchWrapEl = document.getElementById('searchWrap');
const itemShopEl = document.getElementById('itemShopCard');
const mainMenuBtn = document.getElementById('mainMenuBtn');
const shopWrapEl = document.getElementById('shopWrap');
const comingSoonWrapEl = document.getElementById('comingSoonWrap');
const tabEls = () => [tabGames, tabApps, tabLeaderboard];

const MAIN_TABS = [
  {view:'games', label:'Games'},
  {view:'apps', label:'Apps'},
  {view:'leaderboard', label:'Leaderboard'}
];
const SHOP_TABS = [
  {view:'profiles', label:'Avatars'},
  {view:'titles', label:'Player Titles'},
  {view:'banners', label:'Banners'}
];

function applyTabLabels(tabs){
  tabEls().forEach((el, i) => {
    el.textContent = tabs[i].label;
    el.dataset.view = tabs[i].view;
    el.dataset.comingSoon = tabs[i].comingSoon ? '1' : '';
  });
}
function setActiveSlot(idx){
  viewTabs.classList.remove('apps-active','leaderboard-active');
  if(idx === 1) viewTabs.classList.add('apps-active');
  if(idx === 2) viewTabs.classList.add('leaderboard-active');
  tabEls().forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.setAttribute('aria-selected', i === idx ? 'true' : 'false');
  });
}

// ---- banner media (images / GIFs / mp4-webm videos) ----
function isVideoFile(f){ return /\.(mp4|webm)(\?.*)?$/i.test(f || ''); }
function bannerMediaHTML(file, alt, eager){
  const f = esc(file);
  if(isVideoFile(file)){
    return `<video class="bm" src="${f}" muted loop playsinline preload="${eager ? 'auto' : 'metadata'}" aria-label="${esc(alt)}" onloadeddata="this.parentElement.classList.add('loaded')"></video>`;
  }
  const gif = /\.gif(\?.*)?$/i.test(file);
  return `<img class="bm${gif ? ' bm-gif' : ''}" src="${f}" data-full="${f}" alt="${esc(alt)}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" onload="bmLoaded(this)">`;
}
function bmLoaded(img){
  if(img.parentElement) img.parentElement.classList.add('loaded');
  if(!img.classList.contains('bm-gif') || img.dataset.still || img.dataset.stillTried) return;
  img.dataset.stillTried = '1';
  try{
    const w = Math.min(img.naturalWidth, 480);
    if(!w) return;
    const h = Math.round(w * img.naturalHeight / img.naturalWidth);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    img.dataset.still = c.toDataURL('image/jpeg', 0.75);
    if(img.dataset.vis === '0'){ img.dataset.live = '0'; img.src = img.dataset.still; }
  }catch(e){ /* no still frame; GIF just keeps playing */ }
}
const bmObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
  entries.forEach(en => {
    const el = en.target;
    el.dataset.vis = en.isIntersecting ? '1' : '0';
    if(el.tagName === 'VIDEO'){
      if(en.isIntersecting){ const p = el.play(); if(p && p.catch) p.catch(() => {}); }
      else el.pause();
    } else if(el.classList.contains('bm-gif')){
      if(en.isIntersecting){
        if(el.dataset.live === '0'){ el.dataset.live = '1'; el.src = el.dataset.full; }
      } else if(el.dataset.still && el.dataset.live !== '0'){
        el.dataset.live = '0'; el.src = el.dataset.still;
      }
    }
  });
}, { rootMargin: '150px' }) : null;
function observeBannerMedia(root){
  root.querySelectorAll('.bm').forEach(el => {
    if(bmObserver) bmObserver.observe(el);
    else if(el.tagName === 'VIDEO'){ el.autoplay = true; const p = el.play(); if(p && p.catch) p.catch(() => {}); }
  });
}
const _bannerPreloaded = [];
function preloadBanners(n = 8){
  try{
    (banners || []).filter(b => b.file && !isVideoFile(b.file)).slice(0, n).forEach(b => {
      if(_bannerPreloaded.some(im => im.dataset.f === b.file)) return;
      const im = new Image();
      im.dataset.f = b.file;
      im.decoding = 'async';
      im.src = b.file;
      _bannerPreloaded.push(im);
    });
  }catch(e){}
}

let animTimer = null;
function animateViewEnter(dir){
  const dx = (dir * 28) + 'px';
  gridEl.style.setProperty('--dx', dx);
  lbWrapEl.style.setProperty('--dx', dx);
  gridEl.classList.remove('animating');
  lbWrapEl.classList.remove('animating');
  Array.from(gridEl.children).slice(0, 18).forEach((c, n) => c.style.setProperty('--i', n));
  void gridEl.offsetWidth;
  gridEl.classList.add('animating');
  lbWrapEl.classList.add('animating');
  clearTimeout(animTimer);
  animTimer = setTimeout(() => {
    gridEl.classList.remove('animating');
    lbWrapEl.classList.remove('animating');
  }, 1300);
}

function switchView(view){
  const prevView = currentView;
  currentView = view;
  const order = MAIN_TABS.map(t => t.view);
  const dir = Math.sign(order.indexOf(view) - order.indexOf(prevView)) || 0;
  const idx = MAIN_TABS.findIndex(t => t.view === view);
  setActiveSlot(idx);
  searchInput.value = '';

  shopWrapEl.classList.add('hidden');
  comingSoonWrapEl.classList.add('hidden');

  if(view === 'leaderboard'){
    searchWrapEl.classList.add('hidden');
    itemShopEl.classList.remove('hidden');
    document.getElementById('count').classList.add('hidden');
    gridEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    lbWrapEl.classList.remove('hidden');
    renderLeaderboard();
  } else {
    searchWrapEl.classList.remove('hidden');
    itemShopEl.classList.add('hidden');
    document.getElementById('count').classList.remove('hidden');
    gridEl.classList.remove('hidden');
    lbWrapEl.classList.add('hidden');
    searchInput.placeholder = view === 'games' ? 'Search a game, genre...' : 'Search an app...';
    applyFilter();
  }
  animateViewEnter(dir);
}

function switchShopTab(view){
  const idx = SHOP_TABS.findIndex(t => t.view === view);
  const tab = SHOP_TABS[idx];
  setActiveSlot(idx);

  gridEl.classList.add('hidden');
  emptyEl.classList.add('hidden');
  lbWrapEl.classList.add('hidden');
  document.getElementById('count').classList.add('hidden');

  if(tab.comingSoon){
    shopWrapEl.classList.add('hidden');
    comingSoonWrapEl.classList.remove('hidden');
  } else {
    comingSoonWrapEl.classList.add('hidden');
    shopWrapEl.classList.remove('hidden');
    if(view === 'banners') renderBannerShop();
    else if(view === 'profiles') renderProfilesTab();
    else renderShop();
  }
}

function animatedTabSwap(fn){
  viewTabs.classList.add('swapping');
  setTimeout(() => {
    fn();
    viewTabs.classList.remove('swapping');
  }, 180);
}

function enterShopMode(){
  shopMode = true;
  preloadBanners();
  toolbarEl.classList.add('hidden');
  mainMenuBtn.classList.add('visible');
  animatedTabSwap(() => {
    applyTabLabels(SHOP_TABS);
    switchShopTab('titles');
  });
}
function exitShopMode(){
  shopMode = false;
  mainMenuBtn.classList.remove('visible');
  animatedTabSwap(() => {
    applyTabLabels(MAIN_TABS);
    toolbarEl.classList.remove('hidden');
    switchView('games');
  });
}

function unifiedTabClick(idx){
  const view = tabEls()[idx].dataset.view;
  if(shopMode) switchShopTab(view);
  else if(view !== currentView) switchView(view);
}
tabGames.addEventListener('click', () => unifiedTabClick(0));
tabApps.addEventListener('click', () => unifiedTabClick(1));
tabLeaderboard.addEventListener('click', () => unifiedTabClick(2));
mainMenuBtn.addEventListener('click', exitShopMode);
itemShopEl.addEventListener('click', enterShopMode);
['pointerenter','touchstart','focus'].forEach(ev => itemShopEl.addEventListener(ev, () => preloadBanners(), { passive:true, once:true }));
itemShopEl.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') enterShopMode(); });

async function renderProfilesTab(){
  const session = getSession();
  if(!session){
    shopWrapEl.innerHTML = `
      <div class="coming-soon-panel">
        <div class="icon">👤</div>
        <div style="margin-bottom:16px; color:var(--muted); font-size:14px;">Sign in to upload or change your profile picture.</div>
        <button class="btn steam" style="padding:10px 20px;" onclick="renderSignInForm(); openAuth();">Sign In</button>
      </div>
    `;
    return;
  }

// ---- announcement bell ----
(function(){
  const btn = document.getElementById('bellBtn');
  const overlay = document.getElementById('annOverlay');
  const bodyEl = document.getElementById('annBody');
  const SEEN_KEY = 'pirack_ann_seen_v2';
  let items = [], lastLoad = 0;

  function getSeen(){
    try{ const v = JSON.parse(localStorage.getItem(SEEN_KEY) || '[]'); return Array.isArray(v) ? v.map(String) : []; }
    catch(e){ return []; }
  }
  function setSeen(ids){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(ids.slice(-300))); }catch(e){} }
  function normalize(data){
    // supports the new list format and the older single-message format
    let list = [];
    if(Array.isArray(data)) list = data;
    else if(data && Array.isArray(data.announcements)) list = data.announcements;
    else if(data && (data.title || data.message)) list = [{ id: data.id || 'legacy', title: data.title, message: data.message, mode: data.mode, createdAt: Number(data.id) || 0 }];
    return list
      .filter(x => x && (String(x.title || '').trim() || String(x.message || '').trim()))
      .map(x => ({ id: String(x.id), title: String(x.title || ''), message: String(x.message || ''), mode: x.mode === 'blink' ? 'blink' : 'normal', createdAt: Number(x.createdAt) || Number(x.id) || 0 }))
      .sort((p, q) => q.createdAt - p.createdAt);
  }
  function timeAgo(ts){
    if(!ts) return '';
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if(s < 60) return 'just now';
    const m = Math.floor(s / 60);
    if(m < 60) return m + ' min ago';
    const h = Math.floor(m / 60);
    if(h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const d = Math.floor(h / 24);
    if(d < 30) return d + (d === 1 ? ' day ago' : ' days ago');
    const mo = Math.floor(d / 30);
    if(mo < 12) return mo + (mo === 1 ? ' month ago' : ' months ago');
    const y = Math.max(1, Math.floor(d / 365));
    return y + (y === 1 ? ' year ago' : ' years ago');
  }
  function refreshBell(){
    const seen = getSeen();
    btn.classList.toggle('alert', items.some(x => x.mode === 'blink' && !seen.includes(x.id)));
  }
  function openAnn(){
    const seen = getSeen();
    bodyEl.innerHTML = '';
    if(items.length){
      items.forEach(x => {
        const card = document.createElement('div'); card.className = 'ann-item';
        if(x.title.trim()){
          const t = document.createElement('div'); t.className = 'ann-title';
          const tt = document.createElement('span'); tt.textContent = x.title; t.appendChild(tt);
          if(x.mode === 'blink' && !seen.includes(x.id)){
            const n = document.createElement('span'); n.className = 'ann-new'; n.textContent = 'NEW'; t.appendChild(n);
          }
          card.appendChild(t);
        }
        if(x.message.trim()){
          const m = document.createElement('div'); m.className = 'ann-text'; m.textContent = x.message; card.appendChild(m);
        }
        if(x.createdAt){
          const meta = document.createElement('div'); meta.className = 'ann-meta';
          meta.textContent = 'Published ' + timeAgo(x.createdAt);
          meta.title = new Date(x.createdAt).toLocaleString();
          card.appendChild(meta);
        }
        bodyEl.appendChild(card);
      });
      setSeen([...new Set([...seen, ...items.map(x => x.id)])]);
    } else {
      const e = document.createElement('div'); e.className = 'ann-empty'; e.textContent = 'No announcements right now.'; bodyEl.appendChild(e);
    }
    refreshBell();
    bodyEl.scrollTop = 0;
    overlay.classList.add('open');
  }
  function closeAnn(){ overlay.classList.remove('open'); }
  async function loadAnn(){
    lastLoad = Date.now();
    try{
      const r = await fetch('announcement.json?t=' + Date.now(), { cache:'no-store' });
      items = r.ok ? normalize(await r.json()) : [];
    }catch(e){ items = []; }
    refreshBell();
  }
  btn.addEventListener('click', openAnn);
  document.getElementById('annClose').addEventListener('click', closeAnn);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeAnn(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAnn(); });
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && Date.now() - lastLoad > 60000) loadAnn();
  });
  loadAnn();
})();

function parseTrailerUrl(raw){
  let u = (raw || '').trim();
  if(!u) return null;
  // pasted <iframe ... src="..."> code
  const m = u.match(/src\s*=\s*["']([^"']+)["']/i);
  if(m) u = m[1];
  if(u.startsWith('//')) u = 'https:' + u;
  let a, id;
  // Aparat
  if(/aparat\.com/i.test(u)){
    if((a = u.match(/\/videohash\/([A-Za-z0-9]+)/))) id = a[1];
    else if((a = u.match(/aparat\.com\/v\/([A-Za-z0-9]+)/))) id = a[1];
    if(id) return { type:'iframe', src:`https://www.aparat.com/video/video/embed/videohash/${id}/vt/frame`, page:`https://www.aparat.com/v/${id}` };
  }
  // YouTube
  if((a = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i))){
    return { type:'iframe', src:`https://www.youtube-nocookie.com/embed/${a[1]}`, page:`https://youtu.be/${a[1]}` };
  }
  // Vimeo
  if((a = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i))){
    return { type:'iframe', src:`https://player.vimeo.com/video/${a[1]}`, page:`https://vimeo.com/${a[1]}` };
  }
  // direct video file
  if(/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(u)) return { type:'video', src:u, page:u };
  // anything else: try as embeddable page
  return { type:'iframe', src:u, page:u };
}
function openTrailer(gameSlug){
  const g = games.find(x => x.slug === gameSlug);
  if(!g) return;
  modalTitle.textContent = `${g.name} — Trailer`;
  const t = parseTrailerUrl(g.trailer);
  if(t && t.type === 'iframe'){
    const el = document.createElement('iframe');
    el.src = t.src;
    el.allowFullscreen = true;
    el.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
    el.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    modalBody.innerHTML = '';
    modalBody.appendChild(el);
    const link = document.createElement('div');
    link.className = 'modal-extlink';
    const a = document.createElement('a');
    a.href = t.page; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Not loading? Open in a new tab ↗';
    link.appendChild(a);
    modalBody.appendChild(link);
  } else {
    const path = t ? t.src : `trailers/${g.slug}.mp4`;
    const expected = t ? 'The trailer link may be broken or not a direct video link.' : `No trailer uploaded yet for this game.<br>Expected file: trailers/${g.slug}.mp4`;
    modalBody.innerHTML = '';
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true; v.playsInline = true;
    v.src = path;
    v.onerror = () => { modalBody.innerHTML = `<div class="modal-fallback">${expected}</div>`; };
    modalBody.appendChild(v);
  }
  modalOverlay.classList.add('open');
}

/* ---- live wallpaper: drifting embers over dark void, subtle parallax ---- */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W,H,particles=[];
let mx=0.5,my=0.5;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function makeParticle(){
  return {
    x: Math.random()*W,
    y: H + Math.random()*100,
    r: Math.random()*2 + 0.6,
    speed: Math.random()*0.6 + 0.15,
    drift: (Math.random()-0.5)*0.4,
    hue: Math.random() > 0.5 ? 'violet' : 'cyan',
    alpha: Math.random()*0.5 + 0.2,
    flicker: Math.random()*0.02 + 0.005
  };
}
const COUNT = Math.min(120, Math.floor((window.innerWidth*window.innerHeight)/14000));
for(let i=0;i<COUNT;i++){
  const p = makeParticle();
  p.y = Math.random()*H;
  particles.push(p);
}

window.addEventListener('mousemove', e=>{
  mx = e.clientX / window.innerWidth;
  my = e.clientY / window.innerHeight;
});

function draw(){
  ctx.clearRect(0,0,W,H);

  const gx = W * (0.3 + mx*0.4);
  const gy = H * (0.2 + my*0.3);
  const grad = ctx.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*0.6);
  grad.addColorStop(0,'rgba(226,31,61,0.06)');
  grad.addColorStop(0.5,'rgba(242,183,5,0.025)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  const parX = (mx-0.5)*20;

  particles.forEach(p=>{
    p.y -= p.speed;
    p.x += p.drift;
    p.alpha += (Math.random()-0.5)*p.flicker;
    p.alpha = Math.max(0.1, Math.min(0.7, p.alpha));
    if(p.y < -10){
      p.y = H + 10;
      p.x = Math.random()*W;
    }
    const color = p.hue === 'violet' ? `226,31,61` : `242,183,5`;
    ctx.beginPath();
    ctx.arc(p.x + parX, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color},${p.alpha})`;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(${color},0.6)`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

    const { img, scale, offX, offY } = profileCropState;
    const size = canvas.width;
    ctx.clearRect(0,0,size,size);
    const w = img.width * scale;
    const h = img.height * scale;
    const x = size/2 - w/2 + offX;
    const y = size/2 - h/2 + offY;
    ctx.drawImage(img, x, y, w, h);

        profileCropState = { img, scale: minScale, minScale, offX:0, offY:0, dragging:false, lastX:0, lastY:0 };

    const dx = e.clientX - profileCropState.lastX;
    const dy = e.clientY - profileCropState.lastY;
    profileCropState.lastX = e.clientX;
    profileCropState.lastY = e.clientY;
    profileCropState.offX += dx;
    profileCropState.offY += dy;
    drawProfileCrop();
  });
  canvas.addEventListener('pointerup', () => { if(profileCropState) profileCropState.dragging = false; });
  canvas.addEventListener('pointerleave', () => { if(profileCropState) profileCropState.dragging = false; });
  zoomSlider.addEventListener('input', e => {
    if(!profileCropState) return;
    profileCropState.scale = parseFloat(e.target.value);
    drawProfileCrop();
  });

  submitBtn.addEventListener('click', async () => {
    if(!profileCropState) return;
    const statusEl = document.getElementById('profileStatus');
    if(!ISSUES_TOKEN){
      statusEl.textContent = 'Profile picture requests are not set up yet — ask the site owner.';

    statusEl.textContent = 'Sending for approval…';
    statusEl.className = 'profile-status';
    const out = document.createElement('canvas');
    out.width = 400; out.height = 400;
    const octx = out.getContext('2d');
    const ratio = 400/canvas.width;
    const { img, scale, offX, offY } = profileCropState;
    const w = img.width*scale*ratio, h = img.height*scale*ratio;
    const x = 400/2 - w/2 + offX*ratio, y = 400/2 - h/2 + offY*ratio;
    octx.drawImage(img, x, y, w, h);
    const dataUrl = out.toDataURL('image/jpeg', 0.85);
    try{
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/issues`, {
        method:'POST',
        headers:{
          'Authorization': `Bearer ${ISSUES_TOKEN}`,
          'Accept':'application/vnd.github+json',
          'Content-Type':'application/json'
        },
        body: JSON.stringify({
          title: `Avatar request: ${session.player}`,

          labels: ['avatar-request']

      if(!res.ok) throw new Error(`Request failed: ${res.status}`);
      await window.pirackDB.addAvatarSpend(slug(session.player), AVATAR_UPLOAD_COST);
      currentPlayerTitles.avatarSpend = (currentPlayerTitles.avatarSpend || 0) + AVATAR_UPLOAD_COST;
      statusEl.textContent = `Sent! 💎 ${AVATAR_UPLOAD_COST} Prize charged. The site owner will review it soon.`;
      statusEl.className = 'profile-status ok';
      submitBtn.style.display = 'none';
      canvas.style.display = 'none';
      zoomSlider.style.display = 'none';
    }catch(err){
      console.error(err);
      statusEl.textContent = 'Failed to send: ' + err.message;
      statusEl.className = 'profile-status err';
    }
  });
}

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://eouuftmxntizlfjwptbi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_hP_4J6sJstwk3GQveYoLjw_z6Wjsk2K";

  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const DEFAULT_PLAYER_DOC = { ownedTitles: [], selectedTitle: null, ownedBanners: [], selectedBanner: null, ownedProfilePics: [], selectedProfilePic: null, avatarSpend: 0 };

  function rowToDoc(row){
    if(!row) return { ...DEFAULT_PLAYER_DOC };
    return {
      ownedTitles: row.owned_titles || [],
      selectedTitle: row.selected_title || null,
      ownedBanners: row.owned_banners || [],
      selectedBanner: row.selected_banner || null,
      ownedProfilePics: row.owned_profile_pics || [],
      selectedProfilePic: row.selected_profile_pic || null,
      avatarSpend: row.avatar_spend || 0
    };
  }
  function docToRow(playerSlug, docPartial){
    const row = { player_slug: playerSlug };
    if('ownedTitles' in docPartial) row.owned_titles = docPartial.ownedTitles;
    if('selectedTitle' in docPartial) row.selected_title = docPartial.selectedTitle;
    if('ownedBanners' in docPartial) row.owned_banners = docPartial.ownedBanners;
    if('selectedBanner' in docPartial) row.selected_banner = docPartial.selectedBanner;
    if('ownedProfilePics' in docPartial) row.owned_profile_pics = docPartial.ownedProfilePics;
    if('selectedProfilePic' in docPartial) row.selected_profile_pic = docPartial.selectedProfilePic;
    if('avatarSpend' in docPartial) row.avatar_spend = docPartial.avatarSpend;
    return row;
  }

  async function fetchRow(playerSlug){
    const { data, error } = await sb.from('player_data').select('*').eq('player_slug', playerSlug).maybeSingle();
    if(error) throw error;
    return data;
  }
  async function upsertPartial(playerSlug, partial){
    const existing = await fetchRow(playerSlug);
    const current = rowToDoc(existing);
    const merged = { ...current, ...partial };
    const { error } = await sb.from('player_data').upsert(docToRow(playerSlug, merged));
    if(error) throw error;
  }

  // Atomic helpers (need supabase-atomic.sql). If the SQL functions are not installed yet,
  // fall back to the old read-modify-write so the site keeps working.
  const isMissingFn = (e) => e && (e.code === 'PGRST202' || e.code === '42883' || /could not find the function/i.test(e.message || ''));
  async function addItem(playerSlug, kind, id, fallback){
    const { error } = await sb.rpc('pirack_add_item', { p_slug: playerSlug, p_kind: kind, p_id: id });
    if(error){
      if(isMissingFn(error)) return fallback();
      throw error;
    }
  }
  async function setColumn(playerSlug, col, value){
    // Only the given column is written, so a stale copy of other fields can never overwrite newer data.
    const { error } = await sb.from('player_data').upsert({ player_slug: playerSlug, [col]: value });
    if(error) throw error;
  }

  // Exposed for the main (non-module) script to call — same interface as before.
  window.pirackDB = {
    async getPlayerData(playerSlug){
      const row = await fetchRow(playerSlug);
      return rowToDoc(row);
    },
    async addOwnedTitle(playerSlug, titleId){
      await addItem(playerSlug, 'titles', titleId, async () => {
        const current = rowToDoc(await fetchRow(playerSlug));
        if(!current.ownedTitles.includes(titleId)) await upsertPartial(playerSlug, { ownedTitles: [...current.ownedTitles, titleId] });
      });
    },
    async setSelectedTitle(playerSlug, titleId){
      await setColumn(playerSlug, 'selected_title', titleId);
    },
    async addOwnedBanner(playerSlug, bannerId){
      await addItem(playerSlug, 'banners', bannerId, async () => {
        const current = rowToDoc(await fetchRow(playerSlug));
        if(!current.ownedBanners.includes(bannerId)) await upsertPartial(playerSlug, { ownedBanners: [...current.ownedBanners, bannerId] });
      });
    },
    async setSelectedBanner(playerSlug, bannerId){
      await setColumn(playerSlug, 'selected_banner', bannerId);
    },
    async addOwnedProfilePic(playerSlug, picId){
      await addItem(playerSlug, 'profile_pics', picId, async () => {
        const current = rowToDoc(await fetchRow(playerSlug));
        if(!current.ownedProfilePics.includes(picId)) await upsertPartial(playerSlug, { ownedProfilePics: [...current.ownedProfilePics, picId] });
      });
    },
    async setSelectedProfilePic(playerSlug, picId){
      await setColumn(playerSlug, 'selected_profile_pic', picId);
    },
    async addAvatarSpend(playerSlug, amount){
      const { error } = await sb.rpc('pirack_add_spend', { p_slug: playerSlug, p_amount: amount });
      if(error){
        if(!isMissingFn(error)) throw error;
        const current = rowToDoc(await fetchRow(playerSlug));
        await upsertPartial(playerSlug, { avatarSpend: (current.avatarSpend || 0) + amount });
      }
    },
    async getAllPlayerData(){
      const { data, error } = await sb.from('player_data').select('*');
      if(error) throw error;
      const out = {};
      (data || []).forEach(row => { out[row.player_slug] = rowToDoc(row); });
      return out;
    }
  };
  window.dispatchEvent(new Event('pirackDBReady'));
</script>
