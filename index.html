<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirack</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --surface:#121213;
    --surface-2:#18181a;
    --line:#26262a;
    --text:#f2f2f3;
    --muted:#8f8f96;
    --violet:#e21f3d;
    --cyan:#f2b705;
    --gold:#f2b705;
    --ember:#ff3b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  canvas#bg{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0;
    display:block;
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, transparent 0%, rgba(12,6,7,0.55) 70%, rgba(12,6,7,0.95) 100%);
  }
  .gridlines{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:
      linear-gradient(rgba(226,31,61,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,31,61,0.06) 1px, transparent 1px);
    background-size:42px 42px;
    background-position:center center;
    -webkit-mask-image:radial-gradient(ellipse at 50% 20%, black 0%, transparent 75%);
    mask-image:radial-gradient(ellipse at 50% 20%, black 0%, transparent 75%);
  }
  .content{ position:relative; z-index:2; }

  .menu-btn{
    position:fixed;
    top:18px; left:18px;
    z-index:40;
    width:42px; height:42px;
    border-radius:11px;
    background:rgba(18,18,19,0.85);
    border:1px solid var(--line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color .2s, color .2s;
  }
  .menu-btn:hover{ border-color:var(--violet); color:var(--violet); }
  .menu-btn svg{ width:20px; height:20px; }

  .profile-btn{
    position:fixed;
    top:18px; right:18px;
    z-index:40;
    width:42px; height:42px;
    border-radius:50%;
    background:rgba(18,18,19,0.85);
    border:1px solid var(--line);
    color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    overflow:hidden;
    transition:border-color .2s;
  }
  .profile-btn:hover{ border-color:var(--violet); }
  .profile-btn svg{ width:20px; height:20px; }
  .profile-btn img{ width:100%; height:100%; object-fit:cover; }

  .drawer-overlay{
    position:fixed; inset:0; z-index:49;
    background:rgba(0,0,0,0.6);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed;
    top:0; left:0; bottom:0;
    z-index:50;
    width:300px;
    max-width:85vw;
    background:var(--surface);
    border-right:1px solid var(--line);
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
    display:flex;
    flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    font-weight:700;
    font-size:15px;
  }
  .drawer-close{
    background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer;
  }
  .drawer-close:hover{ color:var(--text); }
  .drawer-body{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .wp-option{
    display:flex; align-items:center; gap:12px;
    padding:9px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface-2);
    cursor:pointer;
    transition:border-color .2s;
  }
  .wp-option:hover{ border-color:rgba(255,255,255,0.25); }
  .wp-option.selected{ border-color:var(--violet); box-shadow:0 0 0 1px var(--violet); }
  .wp-thumb{
    width:52px; height:36px;
    border-radius:7px;
    overflow:hidden;
    flex-shrink:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .wp-thumb img, .wp-thumb video{ width:100%; height:100%; object-fit:cover; }
  .wp-name{ flex:1; font-size:14px; font-weight:600; }
  .wp-check{ color:var(--violet); font-size:14px; opacity:0; }
  .wp-option.selected .wp-check{ opacity:1; }

  .custom-wallpaper{
    position:fixed; inset:0; z-index:0;
    display:none;
  }
  .custom-wallpaper.active{ display:block; }
  .custom-wallpaper img, .custom-wallpaper video{
    width:100%; height:100%; object-fit:cover;
  }


  header{
    padding:56px 6vw 10px;
    text-align:center;
  }
  .brand-logo{
    width:160px; height:160px;
    border-radius:22px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#000;
    margin:0 auto 18px;
  }
  .brand-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  h1{
    font-family:'Inter',sans-serif;
    font-weight:900;
    font-size:clamp(32px,6vw,50px);
    letter-spacing:0.03em;
    color:var(--violet);
    line-height:1;
  }
  .sub{
    margin-top:14px;
    color:var(--muted);
    font-size:15px;
    max-width:420px;
    margin-inline:auto;
    letter-spacing:0.02em;
  }
  .sub.file-password{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    max-width:none;
  }
  .sub.file-password strong{ color:var(--text); font-weight:700; }
  .copy-btn{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    color:var(--muted);
    width:28px; height:28px;
    border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:color .2s, border-color .2s, background .2s;
  }
  .copy-btn svg{ width:14px; height:14px; }
  .copy-btn:hover{ color:var(--text); border-color:rgba(255,255,255,0.25); }
  .copy-btn.copied{ color:#2ecc71; border-color:rgba(46,204,113,0.5); }

  .toolbar{
    max-width:1100px;
    margin:8px auto 8px;
    padding:0 6vw;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }
  .item-shop-card{
    position:relative;
    flex:1 1 340px;
    max-width:480px;
    height:48px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:0 18px;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(226,31,61,0.12), rgba(242,183,5,0.08));
    border:1px solid rgba(242,183,5,0.35);
    overflow:hidden;
    cursor:pointer;
    transition:border-color .3s ease, box-shadow .3s ease, filter .3s ease;
  }
  .item-shop-card:hover{
    border-color:rgba(242,183,5,0.65);
    box-shadow:0 0 0 1px rgba(242,183,5,0.25);
    filter:brightness(1.12);
  }
  .item-shop-card::before{
    content:'';
    position:absolute;
    inset:-40%;
    background:radial-gradient(circle, rgba(242,183,5,0.25), transparent 60%);
    animation:shopGlow 3.2s ease-in-out infinite;
  }
  @keyframes shopGlow{
    0%, 100%{ opacity:0.5; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  .item-shop-card .shop-icon{
    font-size:19px;
    position:relative; z-index:1;
  }
  .item-shop-card .shop-text{
    position:relative; z-index:1;
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .item-shop-card .shop-badge{
    position:relative; z-index:1;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(242,183,5,0.5);
    border-radius:999px;
    padding:3px 9px;
  }
  .search-wrap{
    position:relative;
    flex:1 1 340px;
    max-width:480px;
  }
  .search-wrap svg{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:var(--muted);
  }
  #search{
    width:100%;
    height:48px;
    box-sizing:border-box;
    padding:0 18px 0 46px;
    background:rgba(17,17,25,0.8);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:500;
    backdrop-filter:blur(8px);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{border-color:var(--violet); box-shadow:0 0 0 3px rgba(226,31,61,0.18);}

  .count{
    font-size:13px; color:var(--muted); text-align:center; margin:14px 0 8px;
    font-family:'Inter',sans-serif; letter-spacing:0.05em;
  }

  .view-tabs{
    position:relative;
    max-width:420px;
    margin:20px auto 0;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    transition:opacity .18s ease, transform .18s ease;
  }
  .view-tabs.swapping{ opacity:0; transform:scale(0.97); }

  .main-menu-pill{
    display:none;
    max-width:min(480px, calc(100% - 12vw));
    width:100%;
    height:48px;
    box-sizing:border-box;
    margin:0 auto 16px;
    padding:0 18px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:.04em;
    transition:color .5s ease, border-color .5s ease, background-color .5s ease;
  }
  .main-menu-pill:hover{
    color:var(--text);
    border-color:rgba(255,255,255,0.28);
    background-color:rgba(255,255,255,0.06);
  }
  .main-menu-pill.visible{ display:flex; }

  .shop-wrap{ max-width:900px; margin:28px auto 0; padding:0 6vw 60px; }
  .shop-tier{ margin-bottom:32px; }
  .shop-tier-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .shop-tier-name{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .shop-tier-price{
    font-size:11.5px;
    color:var(--muted);
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:999px;
  }
  .shop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:12px;
  }
  .title-card{
    padding:12px 10px;
    border-radius:12px;
    background:var(--surface);
    border:1px solid var(--line);
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .title-card .tname{ font-weight:800; font-size:13.5px; }
  .title-card .tbuy{
    width:100%;
    padding:7px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
  }
  .title-card .tbuy:hover{ border-color:rgba(255,255,255,0.3); }
  .title-card .tbuy.owned{ background:rgba(46,204,113,0.15); border-color:rgba(46,204,113,0.4); color:#2ecc71; cursor:default; }
  .title-card .tbuy.cant-afford{ opacity:0.5; }

  /* tier colors */
  .tier-common .tname, .bname.tier-common, .lb-title.tier-common .tname{ color:#8ecbf5; }
  .tier-common .shop-tier-name{ color:#8ecbf5; }
  .tier-rare .tname, .bname.tier-rare, .lb-title.tier-rare .tname{ color:#3f7fe0; }
  .tier-rare .shop-tier-name{ color:#3f7fe0; }
  .tier-epic .tname, .bname.tier-epic, .lb-title.tier-epic .tname{ color:#b566f2; }
  .tier-epic .shop-tier-name{ color:#b566f2; }
  .tier-legendary .tname, .bname.tier-legendary, .lb-title.tier-legendary .tname{ color:var(--gold); }
  .tier-legendary .shop-tier-name{ color:var(--gold); }
  .tier-champion .tname, .tier-champion .shop-tier-name, .bname.tier-champion, .lb-title.tier-champion .tname{
    background:linear-gradient(90deg,#ff3b3b,#f2b705,#2ecc71,#3f7fe0,#b566f2,#ff3b3b);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:championShift 4s linear infinite;
  }
  @keyframes championShift{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }

  .coming-soon-panel{
    max-width:500px; margin:60px auto; padding:40px 24px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:16px;
    background:var(--surface);
  }

  .banner-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:14px;
  }
  .banner-card{
    border-radius:12px;
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .banner-card .bimg-wrap{
    width:100%; aspect-ratio:5/1;
    background:#000;
    overflow:hidden;
  }
  .banner-card .bimg-wrap img{ width:100%; height:100%; object-fit:cover; }
  .banner-card .binfo{ padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .banner-card .bname{ font-weight:800; font-size:13.5px; }
  .banner-card .bcat{
    display:inline-block;
    font-size:10.5px; font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    width:fit-content;
    border:1px solid currentColor;
  }
  .banner-card .bbuy{
    margin-top:2px;
    padding:7px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
  }
  .banner-card .bbuy.owned{ background:rgba(46,204,113,0.15); border-color:rgba(46,204,113,0.4); color:#2ecc71; cursor:default; }
  .banner-card .bbuy.cant-afford{ opacity:0.5; }

  .equipped-banner-wrap{
    width:100%; aspect-ratio:5/1;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .equipped-banner-wrap img{ width:100%; height:100%; object-fit:cover; }

  .lb-banner-strip{
    display:flex;
    align-items:stretch;
    aspect-ratio:6/1;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    margin-bottom:10px;
  }
  .lb-banner-img{
    position:relative;
    flex:5 1 0;
    min-width:0;
    background:var(--surface-2);
  }
  .lb-banner-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .lb-banner-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 4%;
    background:linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.55) 100%);
  }
  .lb-banner-namecol{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .lb-banner-namecol .lb-player{ color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  .lb-banner-namecol .lb-title{ text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  .lb-banner-statcol{ text-align:right; flex-shrink:0; }
  .lb-banner-statcol .bscore{ color:#fff; font-family:'Orbitron',sans-serif; font-weight:800; font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  .lb-banner-statcol .bprize{ color:var(--gold); font-family:'Orbitron',sans-serif; font-weight:800; font-size:12px; text-shadow:0 1px 3px rgba(0,0,0,0.6); }
  .lb-banner-avatar{
    flex:1 1 0;
    aspect-ratio:1/1;
    overflow:hidden;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron',sans-serif; font-weight:700; color:var(--muted);
  }
  .lb-banner-avatar img{ width:100%; height:100%; object-fit:cover; }

  .coming-soon-panel .icon{ font-size:32px; margin-bottom:12px; }
  .coming-soon-panel .label{ font-family:'Orbitron',sans-serif; font-weight:800; letter-spacing:.05em; color:var(--gold); font-size:13px; text-transform:uppercase; }
  .view-tabs .thumb{
    position:absolute;
    top:4px; bottom:4px;
    left:4px;
    width:calc(33.333% - 4px);
    background:linear-gradient(90deg,var(--violet),#b3172c);
    border-radius:9px;
    transform:translateX(0);
    transition:transform .3s cubic-bezier(.65,0,.35,1);
    z-index:0;
  }
  .view-tabs.apps-active .thumb{ transform:translateX(100%); }
  .view-tabs.leaderboard-active .thumb{ transform:translateX(200%); }
  .view-tab{
    position:relative;
    z-index:1;
    background:none;
    border:none;
    padding:10px 0;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    cursor:pointer;
    border-radius:9px;
    transition:color .25s ease;
  }
  .view-tab.active{ color:#fff; }
  .view-tab:hover:not(.active){ color:var(--text); }

  .lb-wrap{ max-width:760px; margin:32px auto 0; padding:0 6vw 60px; }

  .podium{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:14px;
    margin-bottom:36px;
  }
  .podium-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex:1 1 0;
    min-width:0;
    max-width:150px;
  }
  .podium-card.rank-2{ order:1; }
  .podium-card.rank-1{ order:2; }
  .podium-card.rank-3{ order:3; }
  .podium-avatar{
    border-radius:16px;
    overflow:hidden;
    background:var(--surface-2);
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; font-weight:800; color:var(--muted);
  }
  .podium-card.rank-1 .podium-avatar{ width:84px; height:84px; font-size:28px; border-color:rgba(255,215,0,0.6); box-shadow:0 0 0 3px rgba(255,215,0,0.15); }
  .podium-card.rank-2 .podium-avatar{ width:68px; height:68px; font-size:22px; border-color:rgba(201,210,218,0.55); }
  .podium-card.rank-3 .podium-avatar{ width:68px; height:68px; font-size:22px; border-color:rgba(205,127,50,0.55); }
  .podium-avatar img{ width:100%; height:100%; object-fit:cover; }
  .podium-name{ font-weight:700; font-size:14.5px; text-align:center; }
  .podium-badge{
    display:flex; align-items:center; gap:5px;
    font-family:'Inter',sans-serif;
    font-size:11px; font-weight:700;
    padding:5px 10px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
  }
  .podium-card.rank-1 .podium-badge{ color:#ffd700; border-color:rgba(255,215,0,0.45); }
  .podium-card.rank-2 .podium-badge{ color:#c9d2da; border-color:rgba(201,210,218,0.4); }
  .podium-card.rank-3 .podium-badge{ color:#cd7f32; border-color:rgba(205,127,50,0.45); }
  .podium-platform{
    width:100%;
    border-radius:12px 12px 0 0;
    background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);
    border-bottom:none;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    gap:2px;
    padding:10px 6px;
  }
  .podium-card.rank-1 .podium-platform{ height:88px; border-color:rgba(255,215,0,0.35); }

  .podium-prize{

  .grid{

  .card{

  .poster-fallback{

  .badge{

  .info{

</style>

<body>

<canvas id="bg"></canvas>
<div class="gridlines"></div>
<div class="vignette"></div>
<div class="custom-wallpaper" id="customWallpaper"></div>

<div class="content">
  <button id="menuBtn" class="menu-btn" aria-label="Open menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>

  <button id="profileBtn" class="profile-btn" aria-label="Account">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>

  <div class="drawer-overlay" id="drawerOverlay"></div>

      <span>Wallpaper</span>

  <div class="modal-overlay" id="authOverlay">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-title" id="authTitle">Sign In</span>
        <button class="modal-close" id="authClose">✕</button>
      </div>

  <header>

    <div class="sub file-password">

      <button id="copyPassword" class="copy-btn" aria-label="Copy password" title="Copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>

  <div class="toolbar">

      <input id="search" type="text" placeholder="Search a game, genre...">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <div class="item-shop-card hidden" id="itemShopCard" role="button" tabindex="0">

  <footer>Built for our crew · Keep it between us 🎮</footer>
</div>

<div class="version-tag">v8.8</div>

<div class="modal-overlay" id="modalOverlay">

    <div class="modal-head">
      <span class="modal-title" id="modalTitle">Trailer</span>

<script>
let games = [];
let apps = [];

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function posterHTML(g){
  if(g.poster){
    return `<img src="${g.poster}" alt="${g.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  if(g.appid){
    const url = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`;
    return `<img src="${url}" alt="${g.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  return fallback(g.name);
}
function bannerHTML(g){
  if(g.appid){
    const url = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/header.jpg`;
    return `<img src="${url}" alt="${g.name}" onerror="this.parentElement.innerHTML=fallback('${g.name.replace(/'/g,"\\'")}')">`;
  }
  return fallback(g.name);
}
function fallback(name){
  return `<div class="poster-fallback">${name}</div>`;
}

function render(list){
  const sorted = [...list].sort((a,b) => (b.isNew?1:0) - (a.isNew?1:0));
  grid.innerHTML = sorted.map(g => `
    <div class="card">
      <div class="poster-wrap">
        ${posterHTML(g)}
        ${g.isNew ? '<div class="badge new">New</div>' : ''}
        ${g.comingSoon ? '<div class="badge soon">Coming Soon</div>' : g.free ? '<div class="badge free">Free</div>' : ''}
      </div>
      <div class="info">
        <div class="title">${g.name}</div>
        <div class="tags">${g.genres.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="meta">
          <span>👥 ${g.players}</span>
          <span>💾 ${g.size}</span>
        </div>
        <div class="actions">
          <a class="btn steam" href="${g.steam}" target="_blank" rel="noopener">${g.storeLabel || 'Steam'}</a>
          ${g.comingSoon
            ? `<a class="btn dl disabled" href="#">Soon</a>`
            : `<a class="btn dl" href="${g.dl}" target="_blank" rel="noopener">${g.free ? 'Free' : 'PirateGames'}</a>`
          }
          ${g.dl2
            ? `<a class="btn trailer" href="${g.dl2}" target="_blank" rel="noopener" aria-label="Download">⬇</a>`
            : `<button class="btn trailer disabled" aria-label="Download">⬇</button>`
          }
          <button class="btn trailer" onclick="openTrailer('${g.slug}')" aria-label="Watch trailer">▶</button>
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `${list.length} games`;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

function renderApps(list){
  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="poster-wrap">
        ${a.poster ? `<img src="${a.poster}" alt="${a.name}" loading="lazy" onerror="this.parentElement.innerHTML=fallback('${a.name.replace(/'/g,"\\'")}')">` : fallback(a.name)}
      </div>
      <div class="info">
        <div class="title">${a.name}</div>
        <div class="actions">
          ${a.dl
            ? `<a class="btn dl" href="${a.dl}" target="_blank" rel="noopener" style="flex:1;">Download</a>`
            : `<a class="btn dl disabled" href="#" style="flex:1;">Soon</a>`
          }
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `${list.length} apps`;
  emptyEl.style.display = list.length ? 'none' : 'block';
}

const TITLE_TIERS = [
  {key:'champion', label:'Champion', price:1000, names:['Cyberdemon','The Unbroken','Flawless','Demigod','Immortal','Grandmaster','Warlord','Nightmare','War Machine','Deadeye']},
  {key:'legendary', label:'Legendary', price:800, names:['Mastermind','Unbreakable','Most Wanted','The Captain','Headshot Only','Titan','Ravager','The Warden','Shapeshifter','Assassin']},
  {key:'epic', label:'Epic', price:600, names:['Cyberninja','Hacker','The Collector','Renegade','Mad Scientist','The Sniper','Engineer','Philosopher','Cool Cat','Overlord']},
  {key:'rare', label:'Rare', price:400, names:['The Untamed','Gunslinger','Expert Competitor','Stalwart Hero','Adept Competitor','Knight','Bulldozer','Duality','The Bear','Squire']},
  {key:'common', label:'Common', price:200, names:['DJ','Scientist','Naturalist','Gorgeous','The Pretty','Boom!','Big Guy','Proud','Rookie','Lost']}
];
function titleSlug(str){ return String(str).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function titleId(tierKey, name){ return `${tierKey}-${titleSlug(name)}`; }
function findTitleById(id){
  for(const tier of TITLE_TIERS){
    for(const name of tier.names){
      if(titleId(tier.key, name) === id) return { tier: tier.key, price: tier.price, name };
    }
  }
  return null;
}
function findBannerById(id){
  return banners.find(b => b.id === id) || null;
}
function findProfilePicById(id){
  return profilePics.find(p => p.id === id) || null;
}
const AVATAR_UPLOAD_COST = 1500;
function totalOwnedSpend(ownedTitles, ownedBanners, ownedProfilePics, avatarSpend){
  const titleSpend = (ownedTitles||[]).reduce((sum,id) => { const t = findTitleById(id); return sum + (t ? t.price : 0); }, 0);
  const bannerSpend = (ownedBanners||[]).reduce((sum,id) => { const b = findBannerById(id); return sum + (b ? (b.price||0) : 0); }, 0);
  const picSpend = (ownedProfilePics||[]).reduce((sum,id) => { const p = findProfilePicById(id); return sum + (p ? (p.price||0) : 0); }, 0);
  return titleSpend + bannerSpend + picSpend + (avatarSpend||0);
}

let currentView = 'games';
let leaderboard = [];
let banners = [];
let bannerCategories = [];
let profilePics = [];
let profilePicCategories = [];
let shopMode = false;
let currentPlayerTitles = { ownedTitles: [], selectedTitle: null, ownedBanners: [], selectedBanner: null, ownedProfilePics: [], selectedProfilePic: null, avatarSpend: 0 };
let allPlayerData = {};

function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  if(currentView === 'games'){
    const filtered = games.filter(g =>
      g.name.toLowerCase().includes(q) ||
      g.genres.some(t=>t.toLowerCase().includes(q))
    );
    render(filtered);
  } else if(currentView === 'apps') {
    const filtered = apps.filter(a => a.name.toLowerCase().includes(q));
    renderApps(filtered);

}

function initials(name){
  return (name||'?').trim().slice(0,1).toUpperCase();
}

async function renderLeaderboard(){
  const lbWrap = document.getElementById('lbWrap');
  const sorted = [...leaderboard].sort((a,b) => (b.score||0) - (a.score||0));

  if(sorted.length === 0){
    lbWrap.innerHTML = `<div class="lb-empty">No scores yet.</div>`;
    return;
  }

  if(window.pirackDB){
    try{ allPlayerData = await window.pirackDB.getAllPlayerData(); }
    catch(err){ console.error(err); }
  }

  const top3 = sorted.slice(0,3);
  const rest = sorted.slice(3);

  const avatarHTML = (p, sizeClass) => {
    const data = allPlayerData[slug(p.player)];
    const selectedPic = data && data.selectedProfilePic ? findProfilePicById(data.selectedProfilePic) : null;
    if(selectedPic && selectedPic.file) return `<img src="${selectedPic.file}" alt="${p.player}">`;
    if(p.avatar) return `<img src="${p.avatar}" alt="${p.player}">`;
    return initials(p.player);
  };

  function playerTitleHTML(p){
    const data = allPlayerData[slug(p.player)];
    const selected = data && data.selectedTitle ? findTitleById(data.selectedTitle) : null;
    if(!selected) return '';
    return `<div class="lb-title tier-${selected.tier}"><span class="tname">${esc(selected.name)}</span></div>`;
  }
  function getPlayerBanner(p){
    const data = allPlayerData[slug(p.player)];
    const selected = data && data.selectedBanner ? findBannerById(data.selectedBanner) : null;
    return selected && selected.file ? selected : null;
  }

  const podiumOrder = [top3[1], top3[0], top3[2]]; // rank2, rank1, rank3 (missing ones skipped)
  const podiumHTML = podiumOrder.map((p, idx) => {
    if(!p) return '';
    const rank = top3.indexOf(p) + 1;
    return `
      <div class="podium-card rank-${rank}">
        <div class="podium-avatar">${avatarHTML(p)}</div>
        <div class="podium-name">${p.player}</div>
        ${playerTitleHTML(p)}
        <div class="podium-badge">🏆 ${p.score} Score</div>
        <div class="podium-platform"></div>
      </div>
    `;
  }).join('');

  function rowHTML(p, i){
    const banner = getPlayerBanner(p);
    if(banner){
      return `
        <div class="lb-banner-strip">
          <div class="lb-banner-avatar">${avatarHTML(p)}</div>
          <div class="lb-banner-img">
            <img src="${banner.file}" alt="${esc(banner.name)}">
            <div class="lb-banner-overlay">
              <div class="lb-banner-namecol">
                <div class="lb-player">${esc(p.player)}</div>
                ${playerTitleHTML(p)}
                <div class="lb-score">🏆 ${p.score} Score</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
    return `
      <div class="lb-row">
        <div class="lb-rank">🏆 ${i+4}</div>
        <div class="lb-avatar">${avatarHTML(p)}</div>
        <div class="lb-player-col">
          <div class="lb-player">${esc(p.player)}</div>
          ${playerTitleHTML(p)}
          <div class="lb-score">${p.score} Score</div>
        </div>
      </div>
    `;
  }

  const listHTML = rest.length ? `
    <div class="lb-table">
      ${rest.map((p, i) => rowHTML(p, i)).join('')}
    </div>
  ` : '';

  lbWrap.innerHTML = `<div class="podium">${podiumHTML}</div>${listHTML}`;
}

const MAIN_TABS = [
  {view:'games', label:'Games'},
  {view:'apps', label:'Apps'},
  {view:'leaderboard', label:'Leaderboard'}
];
const SHOP_TABS = [
  {view:'profiles', label:'Avatars'},

];

function applyTabLabels(tabs){
  tabEls().forEach((el, i) => {
    el.textContent = tabs[i].label;
    el.dataset.view = tabs[i].view;
    el.dataset.comingSoon = tabs[i].comingSoon ? '1' : '';
  });
}
function setActiveSlot(idx){
  viewTabs.classList.remove('apps-active','leaderboard-active');
  if(idx === 1) viewTabs.classList.add('apps-active');
  if(idx === 2) viewTabs.classList.add('leaderboard-active');
  tabEls().forEach((el, i) => el.classList.toggle('active', i === idx));
}

function switchView(view){
  currentView = view;
  const idx = MAIN_TABS.findIndex(t => t.view === view);
  setActiveSlot(idx);
  searchInput.value = '';

  shopWrapEl.classList.add('hidden');
  comingSoonWrapEl.classList.add('hidden');

  if(view === 'leaderboard'){
    searchWrapEl.classList.add('hidden');
    itemShopEl.classList.remove('hidden');
    document.getElementById('count').classList.add('hidden');
    gridEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    lbWrapEl.classList.remove('hidden');
    renderLeaderboard();
  } else {
    searchWrapEl.classList.remove('hidden');
    itemShopEl.classList.add('hidden');
    document.getElementById('count').classList.remove('hidden');
    gridEl.classList.remove('hidden');
    lbWrapEl.classList.add('hidden');
    searchInput.placeholder = view === 'games' ? 'Search a game, genre...' : 'Search an app...';
    applyFilter();
  }
}

function switchShopTab(view){
  const idx = SHOP_TABS.findIndex(t => t.view === view);
  const tab = SHOP_TABS[idx];
  setActiveSlot(idx);

  gridEl.classList.add('hidden');
  emptyEl.classList.add('hidden');
  lbWrapEl.classList.add('hidden');
  document.getElementById('count').classList.add('hidden');

  if(tab.comingSoon){
    shopWrapEl.classList.add('hidden');
    comingSoonWrapEl.classList.remove('hidden');
  } else {
    comingSoonWrapEl.classList.add('hidden');
    shopWrapEl.classList.remove('hidden');
    if(view === 'banners') renderBannerShop();
    else if(view === 'profiles') renderProfilesTab();
    else renderShop();
  }
}

function animatedTabSwap(fn){
  viewTabs.classList.add('swapping');
  setTimeout(() => {
    fn();
    viewTabs.classList.remove('swapping');
  }, 180);
}

function enterShopMode(){
  shopMode = true;
  toolbarEl.classList.add('hidden');
  mainMenuBtn.classList.add('visible');
  animatedTabSwap(() => {
    applyTabLabels(SHOP_TABS);
    switchShopTab('titles');

function exitShopMode(){
  shopMode = false;
  mainMenuBtn.classList.remove('visible');

    applyTabLabels(MAIN_TABS);
    toolbarEl.classList.remove('hidden');
    switchView('games');

function unifiedTabClick(idx){
  const view = tabEls()[idx].dataset.view;
  if(shopMode) switchShopTab(view);
  else switchView(view);
}

let wallpapers = [];

async function loadData(){
  try{
    const [gamesRes, appsRes, lbRes, wpRes, bnRes, ppRes] = await Promise.all([
      fetch('games.json?t=' + Date.now()),
      fetch('apps.json?t=' + Date.now()),
      fetch('leaderboard.json?t=' + Date.now()),
      fetch('wallpapers.json?t=' + Date.now()),
      fetch('banners.json?t=' + Date.now()),
      fetch('profilepics.json?t=' + Date.now())
    ]);
    games = await gamesRes.json();
    apps = await appsRes.json();
    leaderboard = lbRes.ok ? await lbRes.json() : [];
    wallpapers = wpRes.ok ? await wpRes.json() : [];
    {
      const bData = bnRes.ok ? await bnRes.json() : { categories: [], items: [] };
      if(Array.isArray(bData)){
        bannerCategories = [];
        banners = bData;
      }else{
        bannerCategories = bData.categories || [];
        banners = bData.items || [];
      }
    }
    {
      const ppData = ppRes.ok ? await ppRes.json() : { categories: [], items: [] };
      profilePicCategories = ppData.categories || [];
      profilePics = ppData.items || [];
    }
  }catch(err){
    countEl.textContent = 'Failed to load data.';
    console.error(err);
    return;
  }
  games.forEach(g => g.slug = slug(g.name));
  apps.forEach(a => a.slug = slug(a.name));
  render(games);
  initWallpapers();
  initAuth();
}
loadData();

// --- wallpaper picker ---
function isVideoFile(path){
  return /\.(mp4|webm|mov)$/i.test(path||'');
}
function getSavedWallpaper(){
  try{ return JSON.parse(localStorage.getItem('pirack_wallpaper_v2') || 'null'); }
  catch(e){ return null; }
}
function saveWallpaper(id, file){
  localStorage.setItem('pirack_wallpaper_v2', JSON.stringify({id, file}));
}
function applyWallpaperMedia(file, name){
  const customEl = document.getElementById('customWallpaper');
  if(!file){
    customEl.classList.remove('active');
    customEl.innerHTML = '';
    return;
  }
  customEl.innerHTML = isVideoFile(file)
    ? `<video src="${file}" muted loop autoplay playsinline></video>`
    : `<img src="${file}" alt="${name||''}">`;
  customEl.classList.add('active');
}
// apply immediately, before games/apps/wallpapers.json finish loading, to avoid a flash
(function(){
  const saved = getSavedWallpaper();
  if(saved && saved.file) applyWallpaperMedia(saved.file, saved.id);
})();

function renderWallpaperList(){
  const saved = getSavedWallpaper();
  const currentId = saved ? saved.id : 'default';
  const list = document.getElementById('wallpaperList');
  const options = [{id:'default', name:'Default', file:null}, ...wallpapers];
  list.innerHTML = options.map(w => `
    <div class="wp-option ${currentId===w.id ? 'selected':''}" data-id="${w.id}" data-file="${w.file||''}" data-name="${w.name}">
      <div class="wp-thumb">
        ${w.file
          ? (isVideoFile(w.file) ? `<video src="${w.file}" muted loop autoplay playsinline></video>` : `<img src="${w.file}" alt="${w.name}">`)
          : '✨'}
      </div>
      <div class="wp-name">${w.name}</div>
      <div class="wp-check">✓</div>
    </div>
  `).join('');
  list.querySelectorAll('.wp-option').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const file = el.dataset.file || null;
      saveWallpaper(id, file);
      applyWallpaperMedia(file, id);
      renderWallpaperList();
    });
  });
}
function initWallpapers(){
  // re-validate the saved selection now that wallpapers.json is loaded
  // (in case it was removed from admin) and sync the media if it changed
  const saved = getSavedWallpaper();
  if(saved && saved.id !== 'default'){
    const stillExists = wallpapers.find(w => w.id === saved.id);
    if(!stillExists){
      saveWallpaper('default', null);
      applyWallpaperMedia(null);
    }
  }
  renderWallpaperList();
}

/* ---- live wallpaper: drifting embers over dark void, subtle parallax ---- */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W,H,particles=[];
let mx=0.5,my=0.5;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function makeParticle(){
  return {
    x: Math.random()*W,
    y: H + Math.random()*100,
    r: Math.random()*2 + 0.6,
    speed: Math.random()*0.6 + 0.15,
    drift: (Math.random()-0.5)*0.4,
    hue: Math.random() > 0.5 ? 'violet' : 'cyan',
    alpha: Math.random()*0.5 + 0.2,
    flicker: Math.random()*0.02 + 0.005
  };
}
const COUNT = Math.min(120, Math.floor((window.innerWidth*window.innerHeight)/14000));
for(let i=0;i<COUNT;i++){
  const p = makeParticle();
  p.y = Math.random()*H;
  particles.push(p);
}

window.addEventListener('mousemove', e=>{
  mx = e.clientX / window.innerWidth;
  my = e.clientY / window.innerHeight;
});

function draw(){
  ctx.clearRect(0,0,W,H);

  const gx = W * (0.3 + mx*0.4);
  const gy = H * (0.2 + my*0.3);
  const grad = ctx.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*0.6);
  grad.addColorStop(0,'rgba(226,31,61,0.06)');
  grad.addColorStop(0.5,'rgba(242,183,5,0.025)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  const parX = (mx-0.5)*20;

  particles.forEach(p=>{
    p.y -= p.speed;
    p.x += p.drift;
    p.alpha += (Math.random()-0.5)*p.flicker;
    p.alpha = Math.max(0.1, Math.min(0.7, p.alpha));
    if(p.y < -10){
      p.y = H + 10;
      p.x = Math.random()*W;
    }
    const color = p.hue === 'violet' ? `226,31,61` : `242,183,5`;
    ctx.beginPath();
    ctx.arc(p.x + parX, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color},${p.alpha})`;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `rgba(${color},0.6)`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

let profileCropState = null;

async function renderProfileView(){
  const session = getSession();
  const p = leaderboard.find(x => x.player === session.player);
  authTitle.textContent = 'My Profile';

  let ownedTitles = [], selectedTitle = null, ownedBanners = [], selectedBanner = null;
  if(window.pirackDB){
    try{
      const data = await window.pirackDB.getPlayerData(slug(session.player));
      ownedTitles = data.ownedTitles || [];
      selectedTitle = data.selectedTitle || null;
      ownedBanners = data.ownedBanners || [];
      selectedBanner = data.selectedBanner || null;
      currentPlayerTitles = data;
    }catch(err){ console.error(err); }
  }

  const titlePickerHTML = ownedTitles.length ? `
    <div style="width:100%;">
      <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:8px; text-align:center;">Your Player Title</label>
      <div id="titlePicker" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
        ${ownedTitles.map(id => {
          const t = findTitleById(id);
          if(!t) return '';
          const isSelected = selectedTitle === id;
          return `<button class="tbuy tier-${t.tier}" style="width:auto; padding:7px 12px; ${isSelected ? 'border-color:var(--violet); box-shadow:0 0 0 1px var(--violet);' : ''}" onclick="pickTitle('${id}')"><span class="tname">${esc(t.name)}</span>${isSelected ? ' ✓' : ''}</button>`;
        }).join('')}
        ${selectedTitle ? `<button class="tbuy" style="width:auto; padding:7px 12px;" onclick="pickTitle(null)">No title</button>` : ''}
      </div>
    </div>
  ` : `<div class="profile-hint">You don't own any player titles yet — visit the Item Shop to buy one.</div>`;

  const bannerPickerHTML = ownedBanners.length ? `
    <div style="width:100%;">
      <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:8px; text-align:center;">Your Banner</label>
      ${selectedBanner ? (() => {
        const b = findBannerById(selectedBanner);
        return b && b.file ? `<div class="equipped-banner-wrap" style="margin-bottom:10px;"><img src="${b.file}" alt="${esc(b.name)}"></div>` : '';
      })() : ''}
      <div id="bannerPicker" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
        ${ownedBanners.map(id => {
          const b = findBannerById(id);
          if(!b) return '';
          const isSelected = selectedBanner === id;
          return `<button class="tbuy" style="width:auto; padding:7px 12px; ${isSelected ? 'border-color:var(--violet); box-shadow:0 0 0 1px var(--violet);' : ''}" onclick="pickBanner('${id}')">${esc(b.name)}${isSelected ? ' ✓' : ''}</button>`;
        }).join('')}
        ${selectedBanner ? `<button class="tbuy" style="width:auto; padding:7px 12px;" onclick="pickBanner(null)">No banner</button>` : ''}
      </div>
    </div>
  ` : `<div class="profile-hint">You don't own any banners yet — visit the Item Shop to buy one.</div>`;

  authBody.innerHTML = `
    <div class="auth-box profile-view">
      <div class="profile-avatar-wrap" id="profileAvatarPreview">
        ${p && p.avatar ? `<img src="${p.avatar}">` : (session.player||'?').slice(0,1).toUpperCase()}
      </div>
      <div class="profile-username">${esc(session.player)}</div>
      ${titlePickerHTML}
      ${bannerPickerHTML}
      <div class="profile-hint">Username and password can only be changed by the site owner. Uploading a new profile picture costs 💎 ${AVATAR_UPLOAD_COST} Prize and needs the site owner's approval.</div>
      <input type="file" accept="image/*" id="profileFileInput" style="width:100%; font-size:12px; color:var(--muted);">
      <canvas id="profileCropCanvas" width="220" height="220" style="display:none; border-radius:16px; cursor:grab; background:#000; margin:0 auto;"></canvas>
      <input type="range" id="profileZoom" min="1" max="4" step="0.01" style="display:none; width:100%;">
      <div class="profile-status" id="profileStatus"></div>
      <div class="profile-actions">
        <button class="btn" id="profileSubmit" style="display:none;">Send for approval</button>
        <button class="btn" id="profileLogout">Log out</button>
      </div>
    </div>
  `;

  document.getElementById('profileLogout').addEventListener('click', () => {
    clearSession();
    updateProfileBtn();
    closeAuth();
  });

  const fileInput = document.getElementById('profileFileInput');
  const canvas = document.getElementById('profileCropCanvas');
  const zoomSlider = document.getElementById('profileZoom');
  const submitBtn = document.getElementById('profileSubmit');
  const ctx = canvas.getContext('2d');

  function drawProfileCrop(){
    if(!profileCropState) return;
    const { img, scale, offX, offY } = profileCropState;
    const size = canvas.width;
    ctx.clearRect(0,0,size,size);
    const w = img.width * scale;
    const h = img.height * scale;
    const x = size/2 - w/2 + offX;
    const y = size/2 - h/2 + offY;
    ctx.drawImage(img, x, y, w, h);
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const size = canvas.width;
        const minScale = Math.max(size/img.width, size/img.height);
        profileCropState = { img, scale: minScale, minScale, offX:0, offY:0, dragging:false, lastX:0, lastY:0 };
        zoomSlider.min = minScale;
        zoomSlider.max = minScale * 4;
        zoomSlider.step = (minScale*4 - minScale)/100;
        zoomSlider.value = minScale;
        canvas.style.display = 'block';
        zoomSlider.style.display = 'block';
        submitBtn.style.display = 'block';
        drawProfileCrop();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  canvas.addEventListener('pointerdown', e => {
    if(!profileCropState) return;
    profileCropState.dragging = true;
    profileCropState.lastX = e.clientX;
    profileCropState.lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if(!profileCropState || !profileCropState.dragging) return;
    const dx = e.clientX - profileCropState.lastX;
    const dy = e.clientY - profileCropState.lastY;
    profileCropState.lastX = e.clientX;
    profileCropState.lastY = e.clientY;
    profileCropState.offX += dx;
    profileCropState.offY += dy;
    drawProfileCrop();
  });
  canvas.addEventListener('pointerup', () => { if(profileCropState) profileCropState.dragging = false; });
  canvas.addEventListener('pointerleave', () => { if(profileCropState) profileCropState.dragging = false; });
  zoomSlider.addEventListener('input', e => {
    if(!profileCropState) return;
    profileCropState.scale = parseFloat(e.target.value);
    drawProfileCrop();
  });

  submitBtn.addEventListener('click', async () => {
    if(!profileCropState) return;
    const statusEl = document.getElementById('profileStatus');
    if(!ISSUES_TOKEN){
      statusEl.textContent = 'Profile picture requests are not set up yet — ask the site owner.';
      statusEl.className = 'profile-status err';
      return;
    }
    const pLb = leaderboard.find(x => x.player === session.player);
    const playerPrize = pLb ? (pLb.prize ?? (pLb.score||0)*5) : 0;
    const spentSoFar = totalOwnedSpend(currentPlayerTitles.ownedTitles, currentPlayerTitles.ownedBanners, currentPlayerTitles.ownedProfilePics, currentPlayerTitles.avatarSpend);
    if(playerPrize - spentSoFar < AVATAR_UPLOAD_COST){
      statusEl.textContent = `Not enough Prize (costs 💎 ${AVATAR_UPLOAD_COST}).`;
      statusEl.className = 'profile-status err';
      return;
    }
    statusEl.textContent = 'Sending for approval…';
    statusEl.className = 'profile-status';
    const out = document.createElement('canvas');
    out.width = 400; out.height = 400;
    const octx = out.getContext('2d');
    const ratio = 400/canvas.width;
    const { img, scale, offX, offY } = profileCropState;
    const w = img.width*scale*ratio, h = img.height*scale*ratio;
    const x = 400/2 - w/2 + offX*ratio, y = 400/2 - h/2 + offY*ratio;
    octx.drawImage(img, x, y, w, h);
    const dataUrl = out.toDataURL('image/jpeg', 0.85);
    try{
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/issues`, {
        method:'POST',
        headers:{
          'Authorization': `Bearer ${ISSUES_TOKEN}`,
          'Accept':'application/vnd.github+json',
          'Content-Type':'application/json'
        },
        body: JSON.stringify({
          title: `Avatar request: ${session.player}`,
          body: `Player: ${session.player}\n---BEGIN AVATAR---\n${dataUrl}\n---END AVATAR---`,
          labels: ['avatar-request']
        })
      });
      if(!res.ok) throw new Error(`Request failed: ${res.status}`);
      await window.pirackDB.addAvatarSpend(slug(session.player), AVATAR_UPLOAD_COST);
      currentPlayerTitles.avatarSpend = (currentPlayerTitles.avatarSpend || 0) + AVATAR_UPLOAD_COST;
      statusEl.textContent = `Sent! 💎 ${AVATAR_UPLOAD_COST} Prize charged. The site owner will review it soon.`;
      statusEl.className = 'profile-status ok';
      submitBtn.style.display = 'none';
      canvas.style.display = 'none';
      zoomSlider.style.display = 'none';
    }catch(err){
      console.error(err);
      statusEl.textContent = 'Failed to send: ' + err.message;
      statusEl.className = 'profile-status err';
    }
  });
}

profileBtn.addEventListener('click', () => {

  const firebaseConfig = {
    apiKey: "AIzaSyAHhqCr4OM_DA4C6lRTilZ0CpqSMhnkVRg",
    authDomain: "pirack-324a0.firebaseapp.com",
    projectId: "pirack-324a0",
    storageBucket: "pirack-324a0.firebasestorage.app",
    messagingSenderId: "1084283658772",
    appId: "1:1084283658772:web:c21f8f139773c8e1cc7d01"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);

  // Exposed for the main (non-module) script to call.
  const DEFAULT_PLAYER_DOC = { ownedTitles: [], selectedTitle: null, ownedBanners: [], selectedBanner: null, ownedProfilePics: [], selectedProfilePic: null, avatarSpend: 0 };
  window.pirackDB = {
    async getPlayerData(playerSlug){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()) return { ...DEFAULT_PLAYER_DOC, ...snap.data() };
      return { ...DEFAULT_PLAYER_DOC };
    },
    async addOwnedTitle(playerSlug, titleId){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { ownedTitles: arrayUnion(titleId) });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, ownedTitles: [titleId] });
      }
    },
    async setSelectedTitle(playerSlug, titleId){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { selectedTitle: titleId });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, selectedTitle: titleId });
      }
    },
    async addOwnedBanner(playerSlug, bannerId){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { ownedBanners: arrayUnion(bannerId) });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, ownedBanners: [bannerId] });
      }

      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { selectedBanner: bannerId });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, selectedBanner: bannerId });
      }
    },
    async addOwnedProfilePic(playerSlug, picId){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { ownedProfilePics: arrayUnion(picId) });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, ownedProfilePics: [picId] });
      }
    },
    async setSelectedProfilePic(playerSlug, picId){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { selectedProfilePic: picId });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, selectedProfilePic: picId });
      }
    },
    async addAvatarSpend(playerSlug, amount){
      const ref = doc(db, "playerData", playerSlug);
      const snap = await getDoc(ref);
      if(snap.exists()){
        await updateDoc(ref, { avatarSpend: increment(amount) });
      }else{
        await setDoc(ref, { ...DEFAULT_PLAYER_DOC, avatarSpend: amount });
      }
    },
    async getAllPlayerData(){
      const snap = await getDocs(collection(db, "playerData"));
      const out = {};
      snap.forEach(d => { out[d.id] = { ...DEFAULT_PLAYER_DOC, ...d.data() }; });
      return out;
    }
  };
  window.dispatchEvent(new Event('pirackDBReady'));
